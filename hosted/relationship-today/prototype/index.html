      function createRealMomentSearchDebouncer(commit, { setTimer = (callback, delay) => window.setTimeout(callback, delay), clearTimer = timerId => window.clearTimeout(timerId) } = {}) {
        let timerId = null;
        let scheduleVersion = 0;
        return {
          schedule(request) {
            const requestVersion = ++scheduleVersion;
            if (timerId !== null) clearTimer(timerId);
            timerId = setTimer(() => {
              if (requestVersion !== scheduleVersion) return;
              timerId = null;
              commit(request);
            }, REAL_MOMENT_SEARCH_DEBOUNCE_MS);
          },
          cancel() {
            scheduleVersion += 1;
            if (timerId !== null) clearTimer(timerId);
            timerId = null;
          }
        };
      }

      function applyRealMomentSearch(request) {
        if (!request || request.token !== realMomentSearchScheduleToken || request.graph !== localVaultStatus.graph || request.generationId !== localVaultStatus.activeGenerationId) return false;
        realSignalState.search = String(request.value ?? "");
        realSignalState.page = 1;
        renderRealMomentFeedOnly({ focusSearch: true });
        return true;
      }

        try {
          if (graph && activeGenerationId) result = queryTrustedMoments(graph, queryOptions);

          result = { ...result, error: true };

        realSignalState.page = result.page;
        realSignalState.generationId = activeGenerationId;

        clearPendingRestore();

          render();
          pageHost.focus();

        confirmDiscardDraft(apply);
      }

      function hasUnsavedDraft() {
        return state.prepared && state.draft !== state.originalDraft;
      }

      function confirmDiscardDraft(action) {
        if (!hasUnsavedDraft()) { action(); return; }
        openDialog({ title: "放弃未保存修改？", body: "<p>离开当前人物后，本次草稿修改不会保留，也不会生成行动记录。</p>", confirm: "放弃并继续", action: () => { closeDialog(); action(); } });
      }

      function describePreference() {
        const originalLength = state.originalDraft.trim().length;
        const editedLength = state.draft.trim().length;
        const traits = [];
        if (editedLength < originalLength) traits.push("更短");
        if (editedLength > originalLength) traits.push("更详细");
        if (state.draft.includes("最近") || state.draft.includes("近况")) traits.push("保留直接问候");
        traits.push(`从 ${originalLength} 字改为 ${editedLength} 字`);
        return traits.join("、");

          state.channel = channel;
          state.originalDraft = person.drafts[channel] || person.drafts.text;
          state.draft = state.originalDraft;
          state.preferenceSaved = false;
          render();
        };
        if (state.draft !== state.originalDraft) {
          openDialog({ title: "放弃当前修改？", body: "<p>切换渠道会使用对应的准备形式，当前未保存修改不会保留。</p>", confirm: "切换渠道", action: apply });

            const next = removeSource(previousGraph, sourceAction.sourceId);
            let result;
            try { result = await commitSourceRemovedGraph(localVaultStatus.adapter, next, localVaultStatus.key); }
            catch { showToast("来源移除失败；原库与密钥均未改变。"); return; }
            localVaultStatus = { ...localVaultStatus, key: result.key, graph: next, activeGenerationId: result.generationId };
            resetLocalAnalysis({ preserveSemantic: true });
            localSafetySnapshot = null;
            const refreshResult = await refreshAfterCommittedBusiness(previousGraph, next, "graph-lifecycle-affected");
            if (refreshResult.ok) showToast("来源已移除；历史 generation/快照已退役且密钥已轮换。");
          } });
        } else if (action === "local-person-trash") {
          await commitLocalMutation(graph => trashPerson(graph, target.dataset.personId), "人物已进入 30 天本地回收站。");
        } else if (action === "local-person-restore") {
          await commitLocalMutation(graph => restorePerson(graph, target.dataset.personId), "人物已从回收站完整恢复。");
        } else if (action === "local-person-purge") {
          openDialog({ title: "永久删除这个人？", body: "<p>当前库内人物、笔记、行动、索引和派生副本将清除。原导出和旧备份不会同步删除；重导或旧备份恢复前必须再次确认。</p>", confirm: "永久删除", danger: true, action: async () => {
            closeDialog();
            const previousGraph = localVaultStatus.graph;
            const next = purgePerson(previousGraph, target.dataset.personId);
            let result;
            try { result = await commitPurgedGraph(localVaultStatus.adapter, next, localVaultStatus.key); }
            catch { showToast("永久删除失败；原库与密钥均未改变。"); return; }
            localVaultStatus = { ...localVaultStatus, key: result.key, graph: next, activeGenerationId: result.generationId };
            resetLocalAnalysis({ preserveSemantic: true });
            const refreshResult = await refreshAfterCommittedBusiness(previousGraph, next, "graph-lifecycle-affected");
            if (refreshResult.ok) showToast("人物已永久删除；历史 generation/快照已退役且 vault key 已轮换。");
          } });
        } else if (action === "local-backup-create") {
          createLocalBackup();
        } else if (action === "local-restore-preview") {
          previewLocalRestore();
        } else if (action === "local-restore-confirm") {
          await confirmLocalRestore();
        } else if (action === "local-snapshot-delete") {
          if (localSafetySnapshot) { await deleteSafetySnapshot(localVaultStatus.adapter, localSafetySnapshot.id); localSafetySnapshot = null; renderSources(); showToast("安全快照已永久删除。"); }
        } else if (action === "reset-demo") {
          openDialog({ title: "重置演示界面？", body: "<p>虚构 mock 会回到初始状态；已确认导入的本机加密关系库不会被这个界面重置删除。</p>", confirm: "重置界面", danger: true, action: () => window.location.reload() });
        } else if (action === "set-batch") {
          confirmDiscardDraft(() => {
            state.batch = target.dataset.batch;
            state.selectedId = null;
            state.prepared = false;
            render();
          });
        } else if (action === "select-person") {
          confirmDiscardDraft(() => {
            state.selectedId = target.dataset.personId;
            state.prepared = false;
            state.preferenceSaved = false;
            state.preferenceSummary = "";
            render();
          });
        } else if (action === "prepare-contact") {
          const person = selectedPerson();
          state.prepared = true;
          state.channel = "text";
          state.originalDraft = person.drafts.text;
          state.draft = state.originalDraft;
          render();
          window.setTimeout(() => document.getElementById("draftEditor")?.focus(), 0);
        } else if (action === "set-channel") {
          chooseChannel(target.dataset.channel);
        } else if (action === "rewrite-draft") {
          const person = selectedPerson();
          state.draft = state.channel === "text" ? `${person.address}，最近怎么样？有段时间没联系了，来问问你。` : `${state.originalDraft}\n\n保持简单，先听对方说。`;
          render();
          showToast("已换成更短、更直接的模拟表达。");
        } else if (action === "save-preference") {
          state.preferenceSummary = describePreference();
          state.preferenceSaved = true;
          render();
          showToast(`已保存本次表达偏好：${state.preferenceSummary}。可随时撤销。`);
        } else if (action === "undo-preference") {
          state.preferenceSaved = false;
          state.preferenceSummary = "";
          render();
          showToast("已撤销本次表达偏好；当前草稿仍保留。");
        } else if (action === "mark-sent") {
          markSent();
        } else if (action === "snooze-person") {
          snoozePerson();
        } else if (action === "cold-person") {
          coldPerson();
        } else if (action === "close-preparation") {
          if (state.draft !== state.originalDraft) openDialog({ title: "放弃未保存修改？", body: "<p>关闭后本次修改不会保留，也不会生成行动记录。</p>", confirm: "放弃并关闭", action: () => { closeDialog(); cancelPreparation(); } }); else cancelPreparation();
        } else if (action === "save-response") {
          const person = selectedPerson();
          const summary = document.getElementById("responseSummary")?.value.trim() || "";
          const myShare = document.getElementById("myShare")?.value.trim() || "";
          const nextAction = document.getElementById("nextAction")?.value || "本次可以结束";
          const promise = document.getElementById("promiseText")?.value.trim();
          const nextDate = document.getElementById("nextDate")?.value || "";
          if (!summary) { showToast("请先写一句对方反馈摘要；若还没有回复，请使用“暂时没有回复”。"); document.getElementById("responseSummary")?.focus(); return; }
          person.status = nextAction === "本次可以结束" ? "completed" : "followup";
          person.timeline.unshift({ type: "对方反馈", at: "刚刚", text: summary });
          if (myShare) person.timeline.unshift({ type: "实际行动", at: "刚刚", text: `我向对方分享：${myShare}` });
          if (promise) person.timeline.unshift({ type: "后续承诺", at: "刚刚", text: promise });
          if (nextAction !== "本次可以结束") person.timeline.unshift({ type: "后续承诺", at: "刚刚", text: `${nextAction}${nextDate ? `；下次关注日期 ${nextDate}` : ""}` });
          render();
          showToast("回复与下一步已记录在本次演示时间线。");
        } else if (action === "mark-no-response") {
          const person = selectedPerson();
          openDialog({ title: "什么时候再看是否有回复？", body: '<p>等待本身也是一种状态，不会自动追发消息。</p><div class="dialog-form"><div class="form-field"><label for="replyReviewDate">复看日期</label><input id="replyReviewDate" type="date" min="2026-08-12" value="2026-08-18"></div></div>', confirm: "记录等待", action: () => {
            const date = document.getElementById("replyReviewDate")?.value || "";
            if (!date) { showToast("请先选择复看日期。"); return; }
            person.status = "awaiting";
            person.timeline.unshift({ type: "后续承诺", at: "刚刚", text: `等待回复，${date} 再看；不会自动追发。` });
            closeDialog(); render(); showToast("已记录为等待回复；不会因为完成任务追发消息。");
          } });
        } else if (action === "show-more") {
          const total = demoPeople.filter(person => person.tier === "light" && person.status === "candidate").length;
          state.lightLimit = Math.min(total, state.lightLimit + 10);
          render();
          showToast(`已显示 ${state.lightLimit} 位轻问候候选；默认 12 人不是硬上限。`);
        } else if (action === "adjust-limit") {
          const tier = target.dataset.tier;
          const delta = Number(target.dataset.delta || 0);
          const total = demoPeople.filter(person => person.tier === tier && person.status === "candidate").length;
          const key = tier === "key" ? "keyLimit" : "lightLimit";
          state[key] = clampBatchLimit(state[key] + delta, total);
          render();
        } else if (action === "recover-fixture") {
          state.fixture = "normal";
          render();
        } else if (action === "open-person-from-library") {
          state.page = "today";
          state.selectedId = target.dataset.personId;
          state.batch = "morning";
          state.prepared = false;
          window.location.hash = "/today";
          render();
        } else if (action === "select-history") {
          const result = selectHistoryDate(state, historyFixtures[state.historyFixture], target.dataset.historyDate);
          if (!result.ok) { showToast("这个日期没有历史批次，已保留当前日期。"); return; }
          state.historyDate = result.historyDate;
          renderHistory();
        } else if (action === "history-step") {
          const result = selectHistoryDate(state, historyFixtures[state.historyFixture], target.dataset.historyDate);
          if (result.ok) { state.historyDate = result.historyDate; renderHistory(); }
        } else if (action === "history-fixture") {
          state.historyFixture = target.dataset.historyFixture;
          const batches = historyFixtures[state.historyFixture];
          state.historyDate = batches[0].batchDate;
          renderHistory();
        } else if (action === "missed-prepare") {
          const item = missedItems.find(candidate => candidate.id === target.dataset.missedId);
          if (item && transitionMissedItem(item.id, "prepare")) {
            state.preparingMissedId = item.id;
            state.page = "today"; state.selectedId = item.personId; state.prepared = true; state.channel = "text";
            const person = personById(item.personId); state.originalDraft = person.drafts.text; state.draft = state.originalDraft;
            window.location.hash = "/today"; render(); showToast("已从原批次进入准备联系；原入口已关闭。");
          }
        } else if (action === "missed-today") {
          const item = missedItems.find(candidate => candidate.id === target.dataset.missedId);
          if (item && transitionMissedItem(item.id, "today")) { personById(item.personId).status = "candidate"; render(); showToast("已移回今天；同一个人只保留一个当前入口。"); }
        } else if (action === "missed-snooze") {
          const itemId = target.dataset.missedId;
          openDialog({ title: "稍后到具体日期", body: '<p>取消不会改变待补状态。</p><div class="dialog-form"><div class="form-field"><label for="missedSnoozeDate">复看日期</label><input id="missedSnoozeDate" type="date" min="2026-08-12" value="2026-08-20"></div></div>', confirm: "确认稍后", action: () => { const date = document.getElementById("missedSnoozeDate")?.value || ""; if (!date) { showToast("请先选择具体日期。"); return; } transitionMissedItem(itemId, "snooze", { date }); closeDialog(); render(); } });
        } else if (action === "missed-ignore") {
          const itemId = target.dataset.missedId;
          openDialog({ title: "只忽略这次推荐？", body: "<p>只关闭当前批次的这一条待补。以后有新的自然理由时，这个人仍可以再次被推荐。</p>", confirm: "忽略本次", action: () => { transitionMissedItem(itemId, "ignore"); closeDialog(); render(); } });
        } else if (action === "edit-relationships") {
          openRelationshipEditor(target.dataset.personId);
        } else if (action === "relationship-cancel") {
          cancelRelationshipEdit(state); relationshipDialog.hidden = true; if (state.dialogReturnFocus?.isConnected) state.dialogReturnFocus.focus();
        } else if (action === "relationship-save") {
          saveRelationshipEdit();
        } else if (action === "dictionary-status") {
          const label = relationshipDictionary.find(item => item.id === target.dataset.dictionaryId)?.label || "这个关系";
          const nextStatus = target.dataset.dictionaryStatus;
          openDialog({ title: nextStatus === "inactive" ? `停用“${escapeHtml(label)}”？` : `恢复“${escapeHtml(label)}”？`, body: `<p>${nextStatus === "inactive" ? "停用后它不再作为新增关系的快捷项；所有人物当前关系、过去关系和时间线原样保留。" : "恢复后它会重新出现在“我的关系”中，不会自动套用给任何人物。"}</p>`, confirm: nextStatus === "inactive" ? "确认停用" : "确认恢复", action: () => { const result = setDictionaryEntryStatus({ dictionary: relationshipDictionary, records: relationshipRecords }, target.dataset.dictionaryId, nextStatus, { saveSucceeded: true }); closeDialog(); render(); showToast(result.ok ? (nextStatus === "inactive" ? "已停用；人物事实没有改变。" : "已恢复为可选关系。") : "操作失败，原状态未改变。"); } });
        } else if (action === "moment-identity") {
          const itemId = target.dataset.itemId;
          const personId = target.dataset.personId;
          openDialog({ title: "确认虚构发布者身份？", body: "<p>确认后只会把这条虚构线索归到目标人物；来源与发布时间仍保留。取消不会改变任何状态。</p>", confirm: "确认身份", action: () => { const result = assignMomentIdentity({ items: momentItems, signals: momentSignals }, itemId, personId, { saveSucceeded: true }); closeDialog(); render(); showToast(result.ok ? "身份已由你确认；线索仍处于待分类。" : "确认失败，状态未改变。"); } });
        } else if (action === "moment-classify") {
          const result = classifyMomentSignal({ signals: momentSignals }, target.dataset.signalId, target.dataset.classification, { saveSucceeded: true });
          render(); showToast(result.ok ? `已设为“${momentClassificationLabel(target.dataset.classification)}”；只有可作为话题才会进入待审核建议。` : "分类未保存，原状态未改变。");
        } else if (action === "moment-source-revoke" || action === "moment-source-delete") {
          const mode = action === "moment-source-delete" ? "delete" : "revoke";
          const sourceId = target.dataset.sourceId;
          openDialog({ title: mode === "delete" ? "删除这个虚构来源？" : "撤销这个虚构来源？", body: `<p>${mode === "delete" ? "删除后派生线索和未来话题同步失效；既有真实行动只保留“当时使用过的来源已删除”，不保留原文。" : "撤销后派生线索立即失效；本次演示可刷新恢复。"}</p><p>取消不会改变任何状态。</p>`, confirm: mode === "delete" ? "确认删除" : "确认撤销", danger: mode === "delete", action: () => { const result = invalidateMomentSource({ sources: momentSources, items: momentItems, signals: momentSignals, preparedTopics: preparedMomentTopics, actionHistory: momentActionHistory }, sourceId, mode, { saveSucceeded: true }); closeDialog(); render(); showToast(result.ok ? (mode === "delete" ? "来源已删除，派生话题同步失效；行动历史没有被反写。" : "来源已撤销，派生线索已失效。") : "操作失败，原状态未改变。"); } });
        } else if (action === "set-primary") {
          const record = relationshipRecords.find(item => item.id === target.dataset.recordId);
          if (record) { state.lastRelationshipSnapshot = relationshipRecords.map(item => ({ ...item })); relationshipRecords.filter(item => item.personId === record.personId).forEach(item => { item.isPrimary = item.id === record.id; }); render(); }
        } else if (action === "clear-primary") {
          state.lastRelationshipSnapshot = relationshipRecords.map(item => ({ ...item })); relationshipRecords.filter(item => item.personId === target.dataset.personId).forEach(item => { item.isPrimary = false; }); render();
        } else if (action === "end-relationship") {
          const record = relationshipRecords.find(item => item.id === target.dataset.recordId);
          if (record) { state.lastRelationshipSnapshot = relationshipRecords.map(item => ({ ...item })); record.status = "ended"; record.to = "2026-08"; record.isPrimary = false; render(); }
        } else if (action === "undo-relationship") {
          undoRelationshipChange();
        } else if (action === "suggestion-accept") {
          decideRelationshipSuggestion(target.dataset.suggestionId, "accepted");
        } else if (action === "suggestion-edit") {
          decideRelationshipSuggestion(target.dataset.suggestionId, "edited-accepted");
        } else if (action === "suggestion-reject") {
          decideRelationshipSuggestion(target.dataset.suggestionId, "rejected");
        } else if (action === "identity-merge") {
          identityDecision(target.dataset.identityId, "merged");
        } else if (action === "identity-separate") {
          identityDecision(target.dataset.identityId, "separated");
        } else if (action === "undo-identity") {
          const item = identityPairs.find(pair => pair.id === target.dataset.identityId);
          if (item) { item.status = "pending"; render(); showToast("已撤销，重新回到待确认身份。"); }
        } else if (action === "simulate-due-review") {
          showToast("复盘到期只会请求重新判断，不会自动恢复联系。");
        } else if (action === "dialog-cancel") {
          if (suiyinAccountLabelSaving || accountAttributionSaving) return;
          clearPendingRestore();
          closeDialog();
        } else if (action === "dialog-confirm") {
          if (typeof state.dialogAction === "function") state.dialogAction(); else closeDialog();
        }
      });

      document.addEventListener("keydown", event => {
        const historyPicker = document.querySelector(".history-picker[open]");
        if (event.key === "Escape" && historyPicker) {
          event.preventDefault();
          closeHistoryPicker(historyPicker, state);
          return;
        }
        if (event.key === "Escape" && localRestorePreview) { clearPendingRestore(); localRestorePreview = null; if (state.page === "sources") renderSources(); }
        const activeDialog = !dialogBackdrop.hidden ? dialogBackdrop : !personFlowBackdrop.hidden ? personFlowBackdrop : null;
        if (!activeDialog) return;
        if (event.key === "Escape") {
          event.preventDefault();
          if (!dialogBackdrop.hidden && (suiyinAccountLabelSaving || accountAttributionSaving)) return;
          if (!dialogBackdrop.hidden) { clearPendingRestore(); closeDialog(); }
          else closePersonFlow();
          return;
        }
        if (event.key === "Tab") {
          const focusable = [...activeDialog.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled])')];
          if (!focusable.length) return;
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
          if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        }
      });

      window.addEventListener("pagehide", () => {
        if (suiyinImportState.staging) void cancelSuiyinImport({ renderAfter: false });
      });

      const hashPage = window.location.hash.replace(/^#\/?/, "");
      if (["today", "missed", "history", "people", "identities", "cold-storage", "sources"].includes(hashPage)) state.page = hashPage;
      void bootstrapLocalVault();
    })();
  </script>
</body>
</html>
