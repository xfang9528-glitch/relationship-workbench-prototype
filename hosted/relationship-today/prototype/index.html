        return visibleMomentSignals(model, personId).map(renderMomentSignal).join("");
      }

      function renderPreparedMomentTopic(topic) {
        return `<article class="prepared-topic"><div class="topic-head"><strong>待审核朋友圈话题</strong><span class="moment-status approved">尚未写入草稿</span></div><p>${escapeHtml(topic.summary || topic.body)}</p><div class="moment-meta"><span>${escapeHtml(topic.publishedAt)}</span><span>来源可追溯 · 仍需用户审核</span></div></article>`;
      }

      function selectHistoryMode(batches) {
        return batches.length <= 7 ? "direct" : "compact";
      }

      function createHistoryNavigation(batches, selectedDate, todayDate) {
        const dates = [...new Set(batches.map(batch => batch.batchDate))].sort();
        const months = {};
        [...dates].reverse().forEach(date => {
          const month = date.slice(0, 7);
          if (!months[month]) months[month] = [];
          months[month].push({ date, isToday: date === todayDate, isSelected: date === selectedDate });
        });
        const index = dates.indexOf(selectedDate);
        return { dates, months, previous: index > 0 ? dates[index - 1] : null, next: index >= 0 && index < dates.length - 1 ? dates[index + 1] : null };
      }

      function selectHistoryDate(current, batches, targetDate) {
        const batch = batches.find(item => item.batchDate === targetDate);
        if (!batch) return { ok: false, historyDate: current.historyDate, error: "missing-batch" };
        return { ok: true, historyDate: targetDate, batch };
      }

      function closeHistoryPicker(picker, current) {
        if (!picker?.open) return false;
        const stableDate = current.historyDate;
        picker.open = false;
        current.historyDate = stableDate;
        picker.querySelector("summary")?.focus();
        return true;
      }

      function renderRelationshipDictionaryOption(entry) {
        return `<label><input type="checkbox" name="customRelationship" value="${escapeHtml(entry.label)}" data-dictionary-id="${entry.id}"> ${escapeHtml(entry.label)}</label>`;
      }

      function renderRelationshipDictionaryEntry(entry) {
        return `<div class="dictionary-row"><span class="dictionary-label"><strong>${escapeHtml(entry.label)}</strong> · ${entry.status === "active" ? "可用于新增" : "已停用，人物事实保留"}</span><button class="btn btn-small ${entry.status === "active" ? "btn-quiet" : "btn-soft"}" type="button" data-action="dictionary-status" data-dictionary-id="${entry.id}" data-dictionary-status="${entry.status === "active" ? "inactive" : "active"}">${entry.status === "active" ? "停用" : "恢复"}</button></div>`;
      }

      function commitRelationshipWithDictionary(model, input) {
        const labels = [...new Set((input.labels || []).map(label => String(label).trim()).filter(Boolean))];
        if (input.cancelled || input.saveSucceeded === false || !labels.length) return { ok: false, error: input.cancelled ? "cancelled" : input.saveSucceeded === false ? "save-failed" : "empty-labels" };
        const dictionaryIds = [];
        if (input.makePrimary) model.records.filter(record => record.personId === input.personId).forEach(record => { record.isPrimary = false; });
        labels.forEach((label, index) => {
          const isSystem = (input.systemLabels || []).includes(label);
          let dictionaryEntry = model.dictionary.find(item => item.label === label);
          if (!isSystem && !dictionaryEntry) {
            dictionaryEntry = { id: `d-${model.dictionary.length + 1}`, label, kind: "custom", status: "active", source: "用户手动确认" };
            model.dictionary.push(dictionaryEntry);
          }
          if (dictionaryEntry) dictionaryIds.push(dictionaryEntry.id);
          if (!model.records.some(record => record.personId === input.personId && record.status === "current" && record.label === label)) model.records.push({ id: `r-d-${model.records.length + 1}`, personId: input.personId, dictionaryId: dictionaryEntry?.id || "", label, status: "current", isPrimary: Boolean(input.makePrimary && index === 0), from: input.from || "时间未记录", to: "", source: input.source || "用户手动确认" });
        });
        return { ok: true, dictionaryIds };
      }

      function setDictionaryEntryStatus(model, entryId, status, options = {}) {
        const entry = model.dictionary.find(item => item.id === entryId);
        if (!entry || !["active", "inactive"].includes(status) || options.cancelled || options.saveSucceeded === false) return { ok: false, error: "not-committed" };
        entry.status = status;
        return { ok: true, entryId, status };
      }

      function personById(id) { return demoPeople.find(person => person.personId === id); }
      function selectedPerson() { return personById(state.selectedId); }
      function routeLabel() {
        return ({ today: "今天", missed: "待补", history: "每日历史", people: "全部关系", identities: "跨来源核对", "cold-storage": "冷藏复盘", sources: "数据来源" })[state.page] || "今天";
      }

      function activeEntryForPerson(personId) {
        const missed = missedItems.find(item => item.personId === personId && ["missed-pending", "preparing-from-history", "today-candidate"].includes(item.actionState));
        if (missed) return { kind: missed.actionState, item: missed };
        const person = personById(personId);
        return person && ["candidate", "awaiting", "replied", "followup"].includes(person.status) ? { kind: "today", item: person } : null;
      }

      function transitionMissedItem(itemId, action, options = {}) {
        const item = missedItems.find(candidate => candidate.id === itemId);
        if (!item || item.actionState !== "missed-pending") return false;
        if (["prepare", "today"].includes(action)) {
          const competing = missedItems.some(candidate => candidate.id !== item.id && candidate.personId === item.personId && ["preparing-from-history", "today-candidate"].includes(candidate.actionState));
          if (competing) return false;
        }
        const next = ({ prepare: "preparing-from-history", today: "today-candidate", snooze: "snoozed", ignore: "ignored-instance" })[action];
        if (!next || (action === "snooze" && !options.date)) return false;
        item.actionState = next;
        item.snoozeAt = action === "snooze" ? options.date : "";
        item.finalLabel = ({ prepare: "已补做", today: "已移回今天", snooze: `已稍后至 ${options.date || ""}`, ignore: "已忽略本次" })[action];
        return true;
      }

      function restoreMissedPreparation(model) {
        const missed = model.missedItems.find(item => item.id === model.preparingMissedId);
        if (!missed || missed.actionState !== "preparing-from-history") return false;
        missed.actionState = "missed-pending";
        missed.finalLabel = "未处理";
        model.preparingMissedId = null;
        return true;
      }

      function cancelRelationshipEdit(model) {
        model.pendingSuggestionId = null;
        return { ok: true };
      }

      function commitRelationshipEdit(model, input) {
        const labels = [...new Set(input.labels.map(label => String(label).trim()).filter(Boolean))];
        if (!labels.length) return { ok: false, error: "empty-labels" };
        const pendingSuggestion = model.suggestions.find(suggestion => suggestion.id === model.pendingSuggestionId && suggestion.decision === "pending");
        if (input.makePrimary) model.records.filter(record => record.personId === input.personId).forEach(record => { record.isPrimary = false; });
        labels.forEach((label, index) => {
          if (!model.records.some(record => record.personId === input.personId && record.status === "current" && record.label === label)) model.records.push({ id: `r-${Date.now()}-${index}`, personId: input.personId, label, status: "current", isPrimary: input.makePrimary && index === 0, from: input.from, to: "", source: pendingSuggestion ? "AI 建议后确认" : "用户手动确认" });
        });
        if (pendingSuggestion) pendingSuggestion.decision = "edited-accepted";
        model.pendingSuggestionId = null;
        return { ok: true };
      }

      function showToast(message) {
        const node = document.createElement("div");
        node.className = "toast";
        node.textContent = message;
        toastRegion.appendChild(node);
        window.setTimeout(() => node.remove(), 3600);
      }

      function openDialog({ title, body, confirm = "确认", danger = false, action }) {
        state.dialogReturnFocus = document.activeElement;
        dialogTitle.textContent = title;
        dialogDescription.innerHTML = body;
        dialogConfirm.textContent = confirm;
        dialogConfirm.className = danger ? "btn btn-danger-soft" : "btn btn-primary";
        dialogConfirm.disabled = false;
        dialogCancel.disabled = false;
        state.dialogAction = action;
        dialogBackdrop.hidden = false;
        window.setTimeout(() => dialogConfirm.focus(), 0);
      }

      function closeDialog() {
        dialogBackdrop.hidden = true;
        state.dialogAction = null;
        if (accountAttributionEditorState.open) accountAttributionEditorState = { open: false, actionToken: null, personId: null, returnScrollTop: 0 };
        if (state.dialogReturnFocus?.isConnected) state.dialogReturnFocus.focus();
        state.dialogReturnFocus = null;
      }

      function reasonTags(person) {
        return person.reasonTypes.map(reason => `<span class="reason-tag ${reasonClass[reason.type] || ""}">${escapeHtml(reason.type)}</span>`).join("");
      }

      function candidateCard(person) {
        const selected = state.selectedId === person.personId;
        const disabled = state.fixture === "disabled";
        const reasonText = state.fixture === "overflow" ? `${person.reasonTypes[0].text} 这是一段用于验证长内容滚动与折叠的补充说明；它不会改变推荐结论，也不会覆盖证据类别。` : person.reasonTypes[0].text;
        return `
          <button class="candidate-card ${selected ? "is-selected" : ""}" type="button" data-action="select-person" data-person-id="${person.personId}" aria-pressed="${selected}" ${disabled ? 'disabled aria-describedby="disabledFixtureNote"' : ""}>
            <span class="avatar" style="--avatar:${person.color}" aria-hidden="true">${person.avatar}</span>
            <span class="candidate-copy">
              <span class="candidate-name-row"><span class="candidate-name">${person.name}</span><span class="mini-pill">${person.relation}</span></span>
              <span class="candidate-meta">${person.location} · ${person.lastContact}联系</span>
              <span class="candidate-reason">${escapeHtml(reasonText)}</span>
              <span class="reason-tags">${reasonTags(person)}</span>
            </span>
            <span class="candidate-arrow" aria-hidden="true">›</span>
          </button>`;
      }

      function stateCard(kind) {
        const config = {
          empty: { icon: "○", title: "今天没有必须处理的人", text: "可以多看一批，或安心结束。没有完成率，也不会制造关系焦虑。", action: "多看一批" },
          error: { icon: "!", title: "这批建议没有准备好", text: "演示中的读取步骤失败了。筛选和已输入内容仍然保留，可以重试。", action: "重试" },
          disabled: { icon: "—", title: "当前操作暂不可用", text: "这批候选缺少足够的可解释依据，因此不能进入联系准备。恢复正常演示后可以继续。", action: "恢复正常状态" },
          offline: { icon: "⌁", title: "当前处于离线演示", text: "全部原型路径仍可使用，但不会连接任何生成、导入或发送服务。", action: "继续离线使用" }
        }[kind];
        return `<div class="state-card"><div class="state-card-inner"><div class="state-icon" aria-hidden="true">${config.icon}</div><h3>${config.title}</h3><p>${config.text}</p><button class="btn btn-primary" type="button" data-action="recover-fixture">${config.action}</button></div></div>`;
      }

      function loadingQueue() {
        return `<div class="queue-scroll" role="status" aria-label="正在准备候选"><div class="skeleton skeleton-line" style="width:34%"></div>${Array.from({ length: 6 }, () => '<div class="skeleton skeleton-card"></div>').join("")}<span class="sr-only">正在准备今日候选，请稍候。</span></div>`;
      }

      function countAdjuster(tier, current, total, label) {
        return `<div class="count-adjust" aria-label="调整${label}显示数量"><button class="count-button" type="button" data-action="adjust-limit" data-tier="${tier}" data-delta="-1" aria-label="减少${label}" ${current <= 1 ? "disabled" : ""}>−</button><span>${current}/${total}</span><button class="count-button" type="button" data-action="adjust-limit" data-tier="${tier}" data-delta="1" aria-label="增加${label}" ${current >= total ? "disabled" : ""}>＋</button></div>`;
      }

      function clampBatchLimit(requested, total) {
        if (total <= 0) return 0;
        return Math.max(1, Math.min(requested, total));
      }

      function syncBatchLimits(keyTotal, lightTotal) {
        state.keyLimit = clampBatchLimit(state.keyLimit, keyTotal);
        state.lightLimit = clampBatchLimit(state.lightLimit, lightTotal);
      }

      function renderToday() {
        if (renderVaultTransitionRoute("today")) return;
        accountAttributionActionTokens = new Map();
        todayActionTokens = new Map();
        localSemanticActionTokens = new Map();
        const morning = state.batch === "morning";
        const runtime = buildRealRuntimeModel(localVaultStatus, undefined, undefined, getLocalProjectionViewModel(localVaultStatus));
        const result = localAnalysisState.status === "ready" ? localAnalysisState.result : null;
        const keyCount = result?.key?.length || 0;
        const lightCount = result?.light?.length || 0;
        let queueBody;
        let detailBody;
        if (!morning) {
          queueBody = '<div class="queue-scroll"><div class="state-card"><div class="state-card-inner"><div class="state-icon" aria-hidden="true">○</div><h3>晚间回复模型尚未接入</h3><p>当前不会用内置人物或固定数量模拟回复。已手工记录的联系结果仍保存在本机关系图中。</p></div></div></div>';
          detailBody = '<div class="empty-detail"><div><div class="empty-detail-art" aria-hidden="true">○</div><h2>这里暂时没有真实晚间详情</h2><p>未来接入已批准的真实模型后再显示。</p></div></div>';
        } else if (localAnalysisState.status === "loading") {
          queueBody = loadingQueue();
          detailBody = '<div class="empty-detail"><div><div class="empty-detail-art" aria-hidden="true">…</div><h2>正在本机分析</h2><p>只读当前已打开的加密关系图。</p></div></div>';
        } else if (localAnalysisState.status === "ready") {
          queueBody = renderLocalAnalysisQueue();
          detailBody = renderLocalAnalysisDetail();
        } else {
          const title = runtime.phase === "checking" ? "正在检查本机关系库" : runtime.phase === "unavailable" ? "本机关系库当前不可用" : localAnalysisState.status === "error" ? "本地分析没有完成" : localAnalysisState.status === "empty" ? "目前没有满足边界的候选" : "尚未开始本地分析";
          const copy = runtime.phase === "ready-empty" ? "当前真实关系图为空；可以先到数据来源导入。" : localAnalysisState.status === "error" ? "关系图没有改变，可以安全重试。" : "页面不会用内置人物补齐候选。";
          queueBody = `<div class="queue-scroll"><div class="state-card"><div class="state-card-inner"><div class="state-icon" aria-hidden="true">○</div><h3>${title}</h3><p>${copy}</p></div></div></div>`;
          detailBody = `<div class="empty-detail"><div><div class="empty-detail-art" aria-hidden="true">○</div><h2>${title}</h2><p>${copy}</p></div></div>`;
        }
        pageHost.innerHTML = `
          <div class="today-layout" data-runtime-source="${morning ? "analysis" : "empty"}">
            <section class="queue-panel" aria-label="今日关系候选">
              <div class="queue-head">
                <span class="eyebrow">${morning ? "Morning review" : "Evening review"}</span>
                <div class="queue-title-row">
                  <div><h2>${morning ? "今天先想起这些人" : "把回复接住"}</h2><p>${morning ? `当前真实分析结果：关键维护 ${keyCount}，轻问候 ${lightCount}。` : "尚无已批准的真实晚间回复模型。"}</p></div>
                  <div class="batch-switch" aria-label="早晚批次">
                    <button class="batch-button ${morning ? "is-active" : ""}" type="button" data-action="set-batch" data-batch="morning" aria-pressed="${morning}">早晨</button>
                    <button class="batch-button ${!morning ? "is-active" : ""}" type="button" data-action="set-batch" data-batch="evening" aria-pressed="${!morning}">晚上</button>
                  </div>
                </div>
              </div>
              ${morning ? renderLocalSemanticBatchStatus() : ""}
              ${morning ? renderLocalAnalysis() : ""}
              ${queueBody}
            </section>
            <section class="detail-panel" aria-label="人物与联系准备">${detailBody}</section>
          </div>`;
      }

      function renderLocalAnalysis() {
        const graph = localVaultStatus.graph;
        const hasGraph = localVaultStatus.state === "ready" && graph && ["sources", "people", "excerpts", "signals"].some(field => Array.isArray(graph[field]) && graph[field].length > 0);
        if (!hasGraph) {
          const checking = localVaultStatus.state === "checking";
          return `<section class="local-analysis-launch is-disabled" aria-label="本地分析入口"><div><h3>${checking ? "正在检查本机加密库" : "还没有可分析的本地关系库"}</h3><p>${checking ? "确认完成后即可在这里启动；不会访问外部服务。" : "先导入本机数据，再从当前加密库生成待确认候选。"}</p></div><button class="btn" type="button" data-page="sources" ${checking ? "disabled" : ""}>先到数据来源导入</button></section>`;
        }
        if (localAnalysisState.status === "loading") return `<section class="local-analysis-launch" role="status" aria-live="polite"><div><h3>正在本机汇总候选…</h3><p>只读当前已打开的加密关系图；不会重新读取目录、上传或发送。</p></div><button class="btn btn-primary" type="button" data-action="local-analysis-start" disabled aria-busy="true">分析中…</button></section>`;
        if (localAnalysisState.status === "error") return `<section class="local-analysis-launch is-error" role="alert"><div><h3>本地分析没有完成</h3><p>加密库没有改变。可以重试；仍不会上传或发送。</p></div><button class="btn btn-primary" type="button" data-action="local-analysis-start">重试本地分析</button></section>`;
        if (localAnalysisState.status === "empty") return `<section class="local-analysis-launch"><div><h3>目前没有满足边界的候选</h3><p>已排除无效来源、回收站和系统噪声；可以先管理关系或稍后重试。</p></div><button class="btn" type="button" data-action="local-analysis-start">重新分析</button></section>`;
        if (localAnalysisState.status === "ready") {
          const aggregate = localAnalysisState.result.aggregate;
          return `<section class="local-analysis-launch" role="status"><div><h3>已在本机生成候选；没有上传或发送</h3><p>结果只在本次页面会话中保留，刷新后可重新运行。</p><div class="analysis-summary"><span>关键维护 ${aggregate.keyCount}</span><span>轻问候 ${aggregate.lightCount}</span><span>排除噪声/无效 ${aggregate.excludedPeople}</span></div></div><button class="btn" type="button" data-action="local-analysis-start">重新分析</button></section>`;
        }
        return `<section class="local-analysis-launch" aria-label="本地分析入口"><div><h3>从本机关系库看今天先关注谁</h3><p>整库聊天语义会在本机自动分析合规一对一直聊；这里只按次数与日期生成今天候选。建议需你确认，不会自动写成关系事实。</p></div><button class="btn btn-primary" type="button" data-action="local-analysis-start">开始本地分析</button></section>`;
      }

      function localAnalysisCandidateCard(candidate) {
        const selected = state.analysisSelectedId === candidate.personId;
        const primaryReason = candidate.reasons[0];
        const activity = candidate.lastActivityDate ? `最近活动 ${candidate.lastActivityDate}` : "未记录活动日期";
        const actionToken = createPrivatePersonActionToken(todayActionTokens, candidate.personId, "today-candidate", ["local-analysis-select"]);
        return `<button class="candidate-card ${selected ? "is-selected" : ""}" type="button" data-action="local-analysis-select" data-action-token="${actionToken}" aria-pressed="${selected}"><span class="avatar" style="--avatar:#607b69" aria-hidden="true">${escapeHtml(candidate.displayName.slice(0, 1) || "人")}</span><span class="candidate-copy"><span class="candidate-name-row"><span class="candidate-name">${escapeHtml(candidate.displayName)}</span><span class="mini-pill">${escapeHtml(publicRelationshipStatus(candidate.personId))}</span></span>${renderSourceBadges(currentProjectedSourceBadges(candidate.personId, candidate.sourceBadges))}<span class="candidate-meta">${activity} · 聊天 ${candidate.excerptCount} · 近况 ${candidate.signalCount}</span><span class="candidate-reason">${escapeHtml(primaryReason.summary)}</span><span class="reason-tags">${candidate.reasons.map(reason => `<span class="reason-tag ${reasonClass[reason.label] || ""}">${escapeHtml(reason.label)}</span>`).join("")}</span></span><span class="candidate-arrow" aria-hidden="true">›</span></button>`;
      }

      function renderLocalAnalysisQueue() {
        const result = localAnalysisState.result;
        if (!result) return loadingQueue();
        return `<div class="queue-scroll"><div class="offline-banner"><span aria-hidden="true">○</span><span><strong>本机分析结果</strong>：仅供你内部审查；不显示人物价值总分。</span></div><section class="queue-section"><div class="section-heading"><h3>关键维护</h3><span>${result.key.length}/3</span></div><div class="candidate-list">${result.key.map(localAnalysisCandidateCard).join("") || '<div class="muted" style="padding:8px">当前没有关键维护候选。</div>'}</div></section><section class="queue-section"><div class="section-heading"><h3>轻问候</h3><span>${result.light.length}/12</span></div><div class="candidate-list">${result.light.map(localAnalysisCandidateCard).join("") || '<div class="muted" style="padding:8px">当前没有轻问候候选。</div>'}</div></section></div>`;
      }

      function renderLocalAnalysisDetail() {
        const candidates = [...(localAnalysisState.result?.key || []), ...(localAnalysisState.result?.light || [])];
        const requestedPersonId = state.librarySelectedPersonId;
        if (requestedPersonId && !candidates.some(item => item.personId === requestedPersonId)) {
          const person = localVaultStatus.graph?.people?.find(item => item.id === requestedPersonId);
          const projectedPerson = getLocalProjectionViewModel(localVaultStatus)?.rowByPerson.get(requestedPersonId) || null;
          const pending = projectedPerson?.boundary !== "confirmed";
          const relationshipSuggestion = person ? currentRelationshipSuggestion(requestedPersonId) : null;
          const requestedActionToken = createPrivatePersonActionToken(todayActionTokens, requestedPersonId, "today-library-detail", ["local-analysis-open-relationship"]);
          const pendingAction = relationshipSuggestion?.manualAddAllowed === true
            ? `<button class="btn btn-primary" type="button" data-action="local-analysis-open-relationship" data-action-token="${requestedActionToken}">管理关系标签</button>`
            : relationshipSuggestion?.state === "identity-review"
              ? '<button class="btn" type="button" data-page="identities">核对跨来源身份</button>'
              : ["loading", "stale"].includes(relationshipSuggestion?.state) ? '<button class="btn" type="button" disabled>正在分析聊天</button>' : pending ? '<button class="btn" type="button" disabled>来源未识别 · 请重导</button>' : '<p>你可以回到关系库，或稍后重新分析。</p>';
          return `<div class="empty-detail"><div><div class="empty-detail-art" aria-hidden="true">○</div><h2>${escapeHtml(projectedPerson?.displayName || person?.name || "该人物")}</h2>${renderSourceBadges(projectedPerson?.sourceBadges)}<div class="record-actions">${renderAccountAttributionAction(requestedPersonId, "today")}</div>${renderRelationshipFactsSummary(relationshipSuggestion, { surface: "today", fallbackLabels: projectedPerson?.relationshipLabels || [] })}${renderRelationshipSuggestionSummary(relationshipSuggestion, { surface: "today" })}<p>该人物当前未进入本次最多 15 人的候选；系统没有改选其他人。</p>${pendingAction}</div></div>`;
        }
        const candidate = candidates.find(item => item.personId === state.analysisSelectedId) || candidates[0];
        if (!candidate) return `<div class="empty-detail"><div><div class="empty-detail-art" aria-hidden="true">○</div><h2>目前没有满足边界的候选</h2><p>可以先管理关系或稍后重新分析。</p></div></div>`;
        const tier = localAnalysisState.result.key.some(item => item.personId === candidate.personId) ? "关键维护" : "轻问候";
        const reasonCards = candidate.reasons.map(reason => `<article class="reason-card"><div class="reason-card-top"><strong>${escapeHtml(reason.label)}</strong><span class="evidence-label">${escapeHtml(reason.evidence.label)}</span></div><p>${escapeHtml(reason.summary)}</p></article>`).join("");
        const projectionViewModel = getLocalProjectionViewModel(localVaultStatus);
        const projectedPerson = projectionViewModel?.rowByPerson.get(candidate.personId) || null;
        const confirmed = projectedPerson?.boundary === "confirmed";
        const relationshipSuggestion = currentRelationshipSuggestion(candidate.personId);
        const currentSingle = projectionViewModel?.singleByPerson.get(candidate.personId) || null;
        const directPending = !confirmed && currentSingle?.directRelationshipAllowed === true && relationshipSuggestion?.manualAddAllowed === true;
        const manual = confirmed ? getManualContactState(localVaultStatus.graph, candidate.personId) : { sent: null, feedback: null, status: null };
        const preparing = localContactPreparation.personId === candidate.personId;
        const detailActionToken = createPrivatePersonActionToken(todayActionTokens, candidate.personId, "today-detail", ["local-analysis-open-relationship", "local-contact-prepare", "local-contact-copy", "local-contact-mark-sent", "local-contact-feedback"]);
        const manageRelationshipAction = relationshipSuggestion?.manualAddAllowed === true
          ? `<button class="btn" type="button" data-action="local-analysis-open-relationship" data-action-token="${detailActionToken}">管理关系标签</button>`
          : `<button class="btn" type="button" disabled>${["loading", "stale"].includes(relationshipSuggestion?.state) ? "正在分析聊天" : "关系暂不可管理"}</button>`;
        const actions = !confirmed ? relationshipSuggestion?.manualAddAllowed === true && directPending
          ? `<p>先管理关系标签；保存成功后才能准备联系。</p><button class="btn btn-primary" type="button" data-action="local-analysis-open-relationship" data-action-token="${detailActionToken}">管理关系标签</button>`
          : relationshipSuggestion?.state === "identity-review"
            ? '<p>该人物涉及跨来源身份；请先核对。</p><button class="btn" type="button" data-page="identities">核对跨来源身份</button>'
            : '<p>当前关系建议仍不可保存；系统不会猜测。</p><button class="btn" type="button" disabled>关系暂不可管理</button>'
          : !preparing ? `${manageRelationshipAction}<button class="btn btn-primary" type="button" data-action="local-contact-prepare" data-action-token="${detailActionToken}">准备联系</button>` : `${manageRelationshipAction}<label for="localContactDraft">可编辑联系文案</label><textarea id="localContactDraft">${escapeHtml(localContactPreparation.draft)}</textarea><div class="detail-actions"><button class="btn" type="button" data-action="local-contact-copy" data-action-token="${detailActionToken}">复制文案</button><button class="btn btn-primary" type="button" data-action="local-contact-mark-sent" data-action-token="${detailActionToken}" ${localContactPreparation.saving ? "disabled" : ""}>我已在外部发送</button><button class="btn btn-quiet" type="button" data-action="local-contact-cancel">取消准备</button></div><p>复制不等于已发送；系统未验证送达。</p>`;
        const feedback = manual.sent ? `<div class="detail-actions"><button class="btn" type="button" data-action="local-contact-feedback" data-action-token="${detailActionToken}" data-status="replied">有回复</button><button class="btn" type="button" data-action="local-contact-feedback" data-action-token="${detailActionToken}" data-status="no-reply">暂无回复</button><button class="btn" type="button" data-action="local-contact-feedback" data-action-token="${detailActionToken}" data-status="follow-up">待跟进</button></div><p>最近状态：${escapeHtml(({ "sent-manually": "已手工发送", replied: "有回复", "no-reply": "暂无回复", "follow-up": "待跟进" })[manual.status] || "尚未行动")}；这是你手动记录的状态，系统没有读取外部回复。</p>` : "";
        const nextStep = projectedPerson?.boundary === "pending" ? directPending ? "下一步：管理关系标签；保存前不会写入或准备联系。" : relationshipSuggestion?.state === "identity-review" ? "下一步：先核对跨来源身份；系统不会猜测。" : "下一步：来源未识别，请重新导入；系统不会猜测。" : "下一步：由你决定管理关系标签或准备一条通用问候。";
        return `<div class="detail-inner"><header class="person-hero"><span class="avatar" style="--avatar:#607b69" aria-hidden="true">${escapeHtml(candidate.displayName.slice(0, 1) || "人")}</span><div class="person-identity"><h2>${escapeHtml(candidate.displayName)}</h2>${renderSourceBadges(currentProjectedSourceBadges(candidate.personId, candidate.sourceBadges))}<div class="record-actions">${renderAccountAttributionAction(candidate.personId, "today")}</div><p>${escapeHtml(publicRelationshipStatus(candidate.personId))} · 仅供你内部审查</p></div><span class="person-status">${tier}</span></header><section class="detail-section"><div class="detail-section-title"><h3>为什么进入今天</h3><span>次数与日期决定节奏；安全语义更新联系内容</span></div><div class="reason-grid">${reasonCards}</div><div class="analysis-boundary"><strong>安全边界：</strong>${escapeHtml(candidate.safeTopic.label)}<br>${escapeHtml(nextStep)}</div></section>${renderRelationshipFactsSummary(relationshipSuggestion, { surface: "today", fallbackLabels: projectedPerson?.relationshipLabels || [] })}${renderRelationshipSuggestionSummary(relationshipSuggestion, { surface: "today" })}${renderLocalSemanticPanel(candidate.personId, "today")}<section class="detail-section"><h3>本机联系准备</h3>${actions}${feedback}${localContactMutation.error ? `<p role="alert">${localContactMutation.error}</p>` : ""}</section></div>`;
      }

      function missedCard(item) {
        const person = personById(item.personId);
        const active = item.actionState === "missed-pending";
        const sourceEntry = dailyBatches.flatMap(batch => batch.entries).find(entry => entry.personId === item.personId && item.sourceBatch === "2026-08-10");
        return `<article class="record-card"><div class="record-head"><div><h3>${escapeHtml(person.name)} <span class="mini-pill">${escapeHtml(person.relation)}</span></h3><p>${escapeHtml(item.sourceBatch)} 推荐 · ${escapeHtml(sourceEntry?.reasonSnapshot || "保留当时的推荐理由")}</p></div><span class="person-status">${escapeHtml(item.finalLabel)}</span></div>
          ${active ? `<div class="record-actions"><button class="btn btn-primary" type="button" data-action="missed-prepare" data-missed-id="${item.id}">现在补做</button><button class="btn" type="button" data-action="missed-today" data-missed-id="${item.id}">移回今天</button><button class="btn" type="button" data-action="missed-snooze" data-missed-id="${item.id}">稍后到具体日期</button><button class="btn btn-quiet" type="button" data-action="missed-ignore" data-missed-id="${item.id}">只忽略这次推荐</button></div>` : `<p class="muted">原批次保留这个结果；未来出现新的理由时仍可以重新推荐。</p>`}</article>`;
      }

      function renderMissed() {
        if (renderVaultTransitionRoute("missed")) return;
        renderHonestEmptyRoute("missed");
      }

      function historyState(entry, batchDate) {
        if (entry.originalState === "completed") return "已完成";
        const item = missedItems.find(candidate => candidate.personId === entry.personId && candidate.sourceBatch === batchDate);
        return item?.finalLabel || ({ "today-candidate": "今天候选" })[entry.originalState] || "未处理";
      }

      function renderHistory() {
        if (renderVaultTransitionRoute("history")) return;
        renderHonestEmptyRoute("history");
      }

      function personRelationships(personId, status = "current") { return relationshipRecords.filter(record => record.personId === personId && record.status === status); }

      function renderPersonFactTimeline(personId) {
        const person = personById(personId);
        const facts = person?.timeline || [];
        return facts.length ? renderTimeline(person) : '<div class="muted">还没有实际联系或反馈；被推荐不会写进这里。</div>';
      }

      function relationshipSummary(personId) {
        const current = personRelationships(personId);
        if (!current.length) return '<span class="muted">还没有确认关系</span>';
        return current.map(record => `<span class="relation-chip ${record.isPrimary ? "is-primary" : ""}">${escapeHtml(record.label)}${record.isPrimary ? " · 主" : ""}</span>`).join("");
      }

      function renderDetail() {
        if (state.batch === "morning" && localAnalysisState.status === "ready") return renderLocalAnalysisDetail();
        if (state.batch === "morning" && ["loading", "empty", "error"].includes(localAnalysisState.status)) {
          const copy = localAnalysisState.status === "loading"
            ? ["…", "正在本机分析", "只读当前加密关系图，不会重新打开目录或发送内容。"]
            : localAnalysisState.status === "empty"
              ? ["○", "目前没有满足边界的候选", "可以先管理关系，或稍后重新分析；本地库没有改变。"]
              : ["!", "本地分析没有完成", "可以在左侧重试；原加密库没有改变。"];
          return `<div class="empty-detail"><div><div class="empty-detail-art" aria-hidden="true">${copy[0]}</div><h2>${copy[1]}</h2><p>${copy[2]}</p></div></div>`;
        }
        if (["loading", "empty", "error", "disabled"].includes(state.fixture)) {
          return `<div class="empty-detail"><div><div class="empty-detail-art" aria-hidden="true">${state.fixture === "loading" ? "…" : "今"}</div><h2>${state.fixture === "loading" ? "正在准备这一批" : "先处理左侧状态"}</h2><p>恢复正常状态后，再选择一个人查看原因和准备问候。</p></div></div>`;
        }
        const person = selectedPerson();
        if (!person) {
          return `<div class="empty-detail"><div><div class="empty-detail-art" aria-hidden="true">人</div><h2>先选一个人</h2><p>列表只告诉你“为什么今天可以想起他”。选中后再看内部理由、可说话题和文案，不让每天变成审稿。</p></div></div>`;
        }

        const statusLabel = ({ candidate: "今天可联系", replied: "有回复待接住", awaiting: "等待回复", followup: "待继续", completed: "本次已完成", snoozed: "已延后", cold: "冷藏复盘中" })[person.status] || "今天可联系";
        const reasonCards = person.reasonTypes.map(reason => `
          <article class="reason-card">
            <div class="reason-card-top"><strong>${reason.type}</strong><span class="evidence-label">证据：${reason.evidence}</span></div>
            <p>${reason.text}</p>
          </article>`).join("");

        const preparedArea = state.prepared ? renderPreparedArea(person) : `
          <div class="detail-actions">
            <button class="btn btn-primary" type="button" data-action="prepare-contact">准备联系</button>
            <button class="btn" type="button" data-action="snooze-person">稍后</button>
            <button class="btn btn-quiet" type="button" data-action="cold-person">冷藏复盘</button>
          </div>
          <div class="truth-note"><span aria-hidden="true">○</span><div><strong>此时还没有生成长文案。</strong><br>先确认人和理由合理，再进入联系准备。</div></div>`;

        const responseArea = state.batch === "evening" || ["replied", "awaiting"].includes(person.status) ? renderResponseArea(person) : "";

        return `<div class="detail-inner">
          <header class="person-hero">
            <span class="avatar" style="--avatar:${person.color}" aria-hidden="true">${person.avatar}</span>
            <div class="person-identity"><h2>${person.name}</h2><p>${person.relation} · ${person.location} · 常用称谓：${person.address}</p></div>
            <span class="person-status">${statusLabel}</span>
          </header>
          <div class="summary-grid">
            <div class="summary-cell"><span>上次联系</span><strong>${person.lastContact}</strong></div>
            <div class="summary-cell"><span>建议层级</span><strong>${person.tier === "key" ? "关键维护" : "轻问候"}</strong></div>
            <div class="summary-cell"><span>来源</span><strong>虚构演示数据</strong></div>
          </div>
          <section class="detail-section">
            <div class="detail-section-title"><h3>为什么今天</h3><span>不做总价值分</span></div>
            <div class="reason-grid">${reasonCards}</div>
          </section>
          <section class="detail-section">
            <div class="detail-section-title"><h3>联系边界</h3><span>内部判断不能直接对外</span></div>
            <div class="boundary-grid">
              <article class="boundary-card private"><div class="boundary-kicker">仅自己看</div><p>${person.internalReason}</p><div class="boundary-note">内部理由、第三方转述和推测不会进入草稿。</div></article>
              <article class="boundary-card public"><div class="boundary-kicker">可以对外说</div><p>${person.safeTopic}</p><div class="boundary-note">仅使用本人公开内容、共同经历或已确认事实。</div></article>
            </div>
          </section>
          ${(() => { const model = { sources: momentSources, signals: momentSignals }; const insights = buildMomentInsights(model, person.personId); const signals = visibleMomentSignals(model, person.personId); return signals.length ? `<section class="detail-section"><div class="detail-section-title"><h3>最近公开线索</h3><span>带来源与时间 · 不计算关系价值分</span></div><div class="moment-insights">${insights.map(item => `<div class="moment-insight"><strong>${escapeHtml(item.category)}</strong><span>${escapeHtml(item.text)}</span><div class="moment-meta"><span>${escapeHtml(item.publishedAt)}</span><span>${escapeHtml(item.sourceId === "ms-wechat" ? "微信朋友圈导出（虚构）" : "碎银朋友圈（虚构）")}</span></div></div>`).join("") || '<div class="muted">目前只有仅内部或已失效线索。</div>'}</div><div class="moment-stack">${signals.map(renderMomentSignal).join("")}</div></section>` : ""; })()}
          ${preparedArea}
          ${responseArea}
          <section class="detail-section">
            <div class="detail-section-title"><h3>关系时间线</h3><span>建议、事实、行动、反馈分开</span></div>
            ${renderTimeline(person)}
          </section>
        </div>`;
      }

      function renderPreparedArea(person) {
        const channels = [
          ["text", "文字"], ["voice", "语音"], ["call", "电话"], ["moment", "朋友圈评论"], ["meeting", "见面"], ["gift", "送礼/帮助"]
        ];
        const channelButtons = channels.map(([value, label]) => `<button class="channel-button ${state.channel === value ? "is-active" : ""}" type="button" data-action="set-channel" data-channel="${value}" aria-pressed="${state.channel === value}">${label}</button>`).join("");
        const preference = state.preferenceSaved ? `<div class="preference-box"><span>已保存本次偏好：${escapeHtml(state.preferenceSummary)}</span><button class="btn btn-small btn-soft" type="button" data-action="undo-preference">撤销</button></div>` : "";
        const preparation = buildContactPreparation(person, { sources: momentSources, signals: momentSignals });
        const momentTopics = preparation.topics;
        return `<section class="detail-section">
          <div class="detail-section-title"><h3>准备联系</h3><span>生成、学习均为原型模拟</span></div>
          <div class="channel-row">${channelButtons}</div>
          <div class="draft-card">
            <div class="draft-head"><strong>${state.channel === "text" ? "文字草稿" : "沟通提纲"}</strong><span class="mock-badge">模拟准备</span></div>
            <label class="sr-only" for="draftEditor">联系内容</label>
            <textarea id="draftEditor" data-action="edit-draft">${escapeHtml(state.draft)}</textarea>
            <div class="draft-foot">
              <span class="draft-status">${state.draft === state.originalDraft ? "尚未修改" : "已修改，偏好尚未保存"}</span>
              <div class="draft-tools">
                <button class="btn btn-small" type="button" data-action="rewrite-draft">换一种简单说法</button>
                <button class="btn btn-small btn-soft" type="button" data-action="save-preference" ${state.draft === state.originalDraft || state.preferenceSaved ? "disabled" : ""}>保存表达偏好</button>
              </div>
            </div>
          </div>
          ${preference}
          ${momentTopics.length ? `<section aria-label="待审核朋友圈话题">${momentTopics.map(renderPreparedMomentTopic).join("")}<p class="dialog-help">话题建议与原草稿保持分开；系统不会自动改写、评论或发送。</p></section>` : '<p class="dialog-help">没有经你确认“可作为话题”的朋友圈线索；未确认、仅内部、不相关和敏感内容不会进入联系准备。</p>'}
          <div class="truth-note"><span aria-hidden="true">!</span><div><strong>发送仍在外部完成。</strong><br>点击下面按钮只记录你自己的动作，系统未验证送达。</div></div>
          <div class="detail-actions">
            <button class="btn btn-primary" type="button" data-action="mark-sent">我已在外部发送</button>
            <button class="btn" type="button" data-action="snooze-person">稍后</button>
            <button class="btn btn-quiet" type="button" data-action="close-preparation">取消准备</button>
          </div>
        </section>`;
      }

      function renderResponseArea(person) {
        const awaitingCopy = person.status === "awaiting" ? `<div class="truth-note"><span aria-hidden="true">○</span><div><strong>正在等待回复。</strong><br>等待本身不代表关系有问题，也不需要为了完成任务追发。</div></div>` : "";
        return `<section class="detail-section">
          <div class="detail-section-title"><h3>${person.status === "replied" ? "接住这次回复" : "行动后的状态"}</h3><span>晚间复盘</span></div>
          ${awaitingCopy}
          <form class="response-form" id="responseForm">
            <div class="form-field"><label for="responseSummary">对方反馈或近况摘要</label><textarea id="responseSummary" required placeholder="只记对后续沟通有帮助的摘要，不必复制完整聊天。">${person.status === "replied" ? "最近已经安顿下来，生活节奏逐渐恢复。" : ""}</textarea><div class="muted" id="responseHint">记录回复时至少写一句摘要；若没有回复，请用“暂时没有回复”。</div></div>
            <div class="form-row">
              <div class="form-field"><label for="myShare">我向对方分享了什么</label><input id="myShare" value="" placeholder="例如：自己的一个近况"></div>
              <div class="form-field"><label for="nextAction">下一步</label><select id="nextAction"><option>本次可以结束</option><option>继续深聊</option><option>约一次语音或电话</option><option>约见面</option><option>以后再问候</option></select></div>
            </div>
            <div class="form-row">
              <div class="form-field"><label for="promiseText">承诺或要记住的事</label><input id="promiseText" value="" placeholder="例如：下月再约"></div>
              <div class="form-field"><label for="nextDate">下次关注日期</label><input id="nextDate" type="date" value="2026-09-11"></div>
            </div>
            <div class="detail-actions"><button class="btn btn-primary" type="button" data-action="save-response">保存并安排下一步</button><button class="btn" type="button" data-action="mark-no-response">暂时没有回复</button></div>
          </form>
        </section>`;
      }

      function renderTimeline(person) {
        if (!person.timeline.length) return `<div class="muted">还没有真实行动记录。系统建议不会自动写成已经发生的事实。</div>`;
        return `<div class="timeline">${person.timeline.map(item => {
          const type = escapeHtml(item.type);
          const at = escapeHtml(item.at);
          const text = escapeHtml(item.text);
          if (item.text.length > 120) {
            return `<article class="timeline-item"><span class="timeline-dot" aria-hidden="true"></span><div class="timeline-copy"><details class="timeline-details"><summary class="timeline-summary"><strong><span class="timeline-type">${type}</span></strong><time>${at}</time><span class="timeline-toggle"><span class="timeline-expand-text">展开</span><span class="timeline-collapse-text">收起</span></span></summary><p>${text}</p></details></div></article>`;
          }
          return `<article class="timeline-item"><span class="timeline-dot" aria-hidden="true"></span><div class="timeline-copy"><strong><span class="timeline-type">${type}</span></strong><time>${at}</time><p>${text}</p></div></article>`;
        }).join("")}</div>`;
      }

      function createViewActionToken(collection, payload, prefix) {
        const token = `${prefix}-${viewActionSession}-${++viewActionSequence}`;
        collection.set(token, payload);
        return token;
      }

      function createPrivatePersonActionToken(collection, personId, surface, allowedActions) {
        return createViewActionToken(collection, Object.freeze({ personId, surface, allowedActions: Object.freeze([...allowedActions]), expectedActiveGenerationId: localVaultStatus.activeGenerationId }), `${surface}-person`);
      }

      function resolvePrivatePersonAction(collection, token, action) {
        const view = collection.get(token);
        if (!view || view.expectedActiveGenerationId !== localVaultStatus.activeGenerationId || !view.allowedActions.includes(action)) return null;
        return view;
      }

      function currentRelationshipSuggestion(personId, vaultStatus = localVaultStatus) {
        return getLocalProjectionViewModel(vaultStatus)?.relationshipSuggestionByPerson.get(personId) || null;
      }

      function relationshipSuggestionCopy(suggestion) {
        if (suggestion?.state === "loading" || suggestion?.state === "stale") return "正在分析聊天";
        if (suggestion?.state === "suggested" && suggestion.suggestedLabels?.length) return `系统建议：${suggestion.suggestedLabels.join("、")} · 待你确认`;
        if (suggestion?.state === "reimport-required") return "部分旧聊天缺少来源信息；你仍可手动补充";
        if (suggestion?.state === "identity-review") return "跨来源身份待核对；核对完成前不会保存关系建议";
        return "暂未判断出关系，可手动补充";
      }

      function renderRelationshipFactsSummary(suggestion, { surface = "people", fallbackLabels = [] } = {}) {
        const labels = Array.isArray(suggestion?.currentLabels) ? suggestion.currentLabels : fallbackLabels;
        if (!labels.length && ["loading", "stale"].includes(suggestion?.state)) return "";
        const content = labels.length
          ? labels.map(label => `<span class="relation-chip">${escapeHtml(label)}</span>`).join(" ")
          : '<span class="muted">尚未添加关系标签</span>';
        if (surface === "people") return content;
        return `<section class="detail-section relationship-facts-summary"><div class="detail-section-title"><h3>已确认关系标签</h3><span>${labels.length} 个</span></div><div class="relation-panel">${content}</div></section>`;
      }

      function renderRelationshipSuggestionSummary(suggestion, { surface = "people", candidateIndexByLabel = new Map(), actionToken = "" } = {}) {
        if (!suggestion) return "";
        const copy = relationshipSuggestionCopy(suggestion);
        const stateName = ["loading", "suggested", "manual-needed", "reimport-required", "identity-review", "stale"].includes(suggestion.state) ? suggestion.state : "manual-needed";
        const suggestionChips = suggestion.state === "suggested"
          ? suggestion.suggestedLabels.map(label => `<span class="relation-chip is-suggestion">${escapeHtml(label)}</span>`).join(" ")
          : "";
        const controls = surface === "modal" && suggestion.state === "suggested"
          ? suggestion.suggestedLabels.map(label => {
              const candidateIndex = candidateIndexByLabel.get(label);
              const unavailable = suggestion.acceptAllowed !== true || !Number.isInteger(candidateIndex) || candidateIndex < 0;
               return `<div class="relation-row"><span class="relation-chip is-suggestion">${escapeHtml(label)}</span><div class="record-actions"><button class="btn btn-small btn-primary" type="button" data-action="local-semantic-accept" data-action-token="${escapeHtml(actionToken)}" data-candidate-index="${Number.isInteger(candidateIndex) ? candidateIndex : -1}" ${unavailable || !actionToken ? "disabled" : ""}>接受</button><button class="btn btn-small" type="button" data-action="local-semantic-edit-accept" data-action-token="${escapeHtml(actionToken)}" data-candidate-index="${Number.isInteger(candidateIndex) ? candidateIndex : -1}" ${unavailable || !actionToken ? "disabled" : ""}>修改后接受</button><button class="btn btn-small btn-quiet" type="button" data-action="local-semantic-reject" data-action-token="${escapeHtml(actionToken)}" data-candidate-index="${Number.isInteger(candidateIndex) ? candidateIndex : -1}" ${!actionToken ? "disabled" : ""}>忽略</button></div></div>`;
            }).join("")
          : "";
        const content = controls || suggestionChips;
        return `<section class="relationship-suggestion-summary" data-relationship-suggestion-state="${stateName}" ${stateName === "loading" || stateName === "stale" ? 'role="status"' : ""}>${surface === "modal" ? '<div class="detail-section-title"><h3>系统关系建议</h3><span>接受前不是关系事实</span></div>' : ""}<p class="relationship-suggestion-copy">${escapeHtml(copy)}</p>${content ? `<div class="relationship-suggestion-content">${content}</div>` : ""}</section>`;
      }

      function renderRelationshipModalContent(graph, person, semanticPanelMarkup = "") {
        if (!person) return '<p role="alert">这个人物当前不可用；原关系没有改变。</p>';
        const projectionViewModel = getLocalProjectionViewModel(localVaultStatus);
        const suggestion = projectionViewModel?.relationshipSuggestionByPerson.get(person.personId) || null;
        const directPending = person.boundary !== "confirmed" && projectionViewModel?.singleByPerson.get(person.personId)?.directRelationshipAllowed === true && suggestion?.manualAddAllowed === true;
        const attributionAction = renderAccountAttributionAction(person.personId, "modal");
        relationshipActionTokens = new Map();
        const relationships = (graph.relationships || []).filter(item => item.personId === person.personId && ["current", "confirmed"].includes(item.status)).sort((left, right) => String(left.createdAt || "").localeCompare(String(right.createdAt || "")) || String(left.label).localeCompare(String(right.label)));
        const saved = relationships.length ? relationships.map(item => {
          const actionToken = createViewActionToken(relationshipActionTokens, { relationshipId: item.id, label: item.label }, "relationship");
          return `<div class="relation-row"><span class="relation-chip">${escapeHtml(item.label)}</span><div class="record-actions"><button class="btn btn-small" type="button" data-action="real-relationship-edit" data-action-token="${actionToken}" ${realRelationshipState.saving ? "disabled" : ""}>编辑</button><button class="btn btn-small btn-danger-soft" type="button" data-action="real-relationship-delete" data-action-token="${actionToken}" ${realRelationshipState.saving ? "disabled" : ""}>删除</button></div></div>`;
        }).join("") : ["loading", "stale"].includes(suggestion?.state) ? "" : '<p class="muted">尚未添加关系标签</p>';
        const dictionaryLabels = [...new Set([...RELATIONSHIP_SYSTEM_LABELS, ...(graph.dictionary || []).filter(item => item.status === "active").map(item => item.label)])].map(label => `<option value="${escapeHtml(label)}"></option>`).join("");
        const mutationError = realRelationshipState.status === "error" ? '<p class="person-flow-status is-error" role="alert">保存没有完成；原关系未改变，可以重试。</p>' : "";
        const semanticResult = currentLocalSemanticEntry(person.personId)?.result || null;
        const candidateIndexByLabel = new Map((semanticResult?.candidates || []).map((candidate, index) => [candidate.label, index]));
        const modalActionToken = createPrivatePersonActionToken(localSemanticActionTokens, person.personId, "relationship-modal", ["local-semantic-accept", "local-semantic-edit-accept", "local-semantic-reject", "real-relationship-save"]);
        const suggestionMarkup = renderRelationshipSuggestionSummary(suggestion, { surface: "modal", candidateIndexByLabel, actionToken: modalActionToken });
        const manualDisabled = suggestion?.manualAddAllowed === true && !realRelationshipState.saving ? "" : "disabled";
        return `${attributionAction ? `<section class="detail-section"><div class="detail-section-title"><h3>账号归属</h3><span>只改当前人物</span></div><div class="record-actions">${attributionAction}</div></section>` : ""}<section class="detail-section"><div class="detail-section-title"><h3>已确认关系标签</h3><span>${relationships.length} 个</span></div><div class="relation-panel">${saved}</div></section>${suggestionMarkup}${semanticPanelMarkup}<section class="detail-section"><div class="detail-section-title"><h3>手动补充关系</h3><span>由你最终保存</span></div>${mutationError}<div class="dialog-form"><div class="form-field"><label for="realRelationshipLabelInput">添加系统或自定义标签</label><input id="realRelationshipLabelInput" list="realRelationshipLabelOptions" maxlength="40" placeholder="例如：朋友、客户或自定义名称" ${manualDisabled}><datalist id="realRelationshipLabelOptions">${dictionaryLabels}</datalist></div><div class="record-actions"><button class="btn btn-primary" type="button" data-action="real-relationship-save" data-action-token="${modalActionToken}" ${manualDisabled}${realRelationshipState.saving ? ' aria-busy="true"' : ""}>${realRelationshipState.saving ? "正在加密保存…" : "保存标签"}</button></div></div><p class="dialog-help">${directPending ? "首次保存关系标签时会同时建立来源归属；取消不会写入。这里的来源归属只指这个单一来源人物可管理，账号归属仍单独核对。" : "只有你保存或接受候选后才会写入关系事实。"}</p></section>`;
      }

      function createLocalSemanticProgressPainter({ paint, paintTerminal, requestFrame, cancelFrame }) {
        let frameId = null;
        let activeToken = null;
        let hasActiveToken = false;
        let scheduledToken = null;
        const cancelScheduledFrame = () => {
          if (frameId !== null) cancelFrame(frameId);
          frameId = null;
          scheduledToken = null;
        };
        return {
          progress(token) {
            activeToken = token;
            hasActiveToken = true;
            scheduledToken = token;
            if (frameId !== null) return;
            frameId = requestFrame(() => {
              frameId = null;
              const tokenToPaint = scheduledToken;
              scheduledToken = null;
              if (!hasActiveToken || tokenToPaint !== activeToken) return;
              paint(tokenToPaint);
            });
          },
          terminal(token) {
            if (!hasActiveToken || token !== activeToken) return;
            cancelScheduledFrame();
            hasActiveToken = false;
            paintTerminal(token);
          },
          fallback(token) {
            cancelScheduledFrame();
            activeToken = token;
            hasActiveToken = false;
            paintTerminal(token);
          },
          discard(token) {
            if (!hasActiveToken || token !== activeToken) return;
            cancelScheduledFrame();
            hasActiveToken = false;
          },
          cancelSurface() {
            cancelScheduledFrame();
          }
        };
      }

      function updateLocalSemanticProgressSurface() {
        const current = pageHost.querySelector("[data-local-semantic-batch]");
        if (!current?.isConnected) return false;
        const template = document.createElement("template");
        template.innerHTML = renderLocalSemanticBatchStatus().trim();
        const next = template.content.firstElementChild;
        if (!next) return false;
        current.replaceWith(next);
        return true;
      }

      const localSemanticProgressPainter = createLocalSemanticProgressPainter({
        paint: token => token === localSemanticBatchToken && updateLocalSemanticProgressSurface(),
        paintTerminal: token => { if (token === localSemanticBatchToken) render(); },
        requestFrame: callback => window.requestAnimationFrame(callback),
        cancelFrame: frameId => window.cancelAnimationFrame(frameId)
      });

      function renderLocalSemanticBatchStatus() {
        const batch = localSemanticBatchState;
        const running = batch.status === "queued" || batch.status === "running";
        const incremental = batch.scope === "affected";
        const title = batch.cacheStatus === "save-failed"
          ? batch.businessCommitted ? "数据已保存；分析缓存未更新，可重试" : "本次分析已完成，但未保存；下次打开需重新分析"
          : batch.reason === "vault-cache-hit"
            ? "已恢复上次本机分析结果"
            : running && batch.reason === "cache-miss-full"
              ? "本机分析缓存缺失，正在完成首次分析"
              : running && ["cache-invalid-full", "algorithm-upgrade-full"].includes(batch.reason)
                ? "已有结果已过期，正在按当前数据重新分析"
                : running
                  ? incremental ? `正在本机增量更新 ${batch.processed}/${batch.total}` : `正在本机分析 ${batch.processed}/${batch.total}`
                  : batch.status === "ready"
            ? incremental ? `本次增量更新已完成 ${batch.processed}/${batch.total}` : `整库本机分析已完成 ${batch.coverageProcessed}/${batch.coverageTotal}`
            : batch.status === "partial"
              ? incremental ? `本次增量更新 ${batch.processed}/${batch.total}，部分证据不足` : `整库分析完成 ${batch.coverageProcessed}/${batch.coverageTotal}，部分证据不足`
              : batch.status === "error"
                ? "整库本机分析没有完成"
                : "整库本机分析等待开始";
        const summary = `${incremental ? `本次更新 ${batch.processed}/${batch.total} · ` : ""}整库覆盖 ${batch.coverageProcessed}/${batch.coverageTotal} · 已分析 ${batch.ready} · 通用问候 ${batch.generic} · 无合规正文 ${batch.empty} · 需重导 ${batch.reimportRequired} · 来源归属不足 ${batch.unconfirmed} · 失败 ${batch.error}`;
        const detail = running ? "只读当前已解锁关系库；会分批让出页面响应。" : batch.cacheStatus === "save-failed" ? "当前页面仍可使用已完成的安全结果；重试不会改写关系、来源归属或发送事实。" : summary;
        return `<section class="local-analysis-launch" data-local-semantic-batch role="status" aria-live="polite"><div><h3>${title}</h3><p>${detail}${batch.completedAtLabel ? ` · 最近完成 ${escapeHtml(batch.completedAtLabel)}` : ""}</p></div><button class="btn" type="button" data-action="local-semantic-refresh-all" ${running || localVaultStatus.state !== "ready" ? "disabled" : ""}>${running ? "分析中…" : "重新分析全部"}</button></section>`;
      }

      function renderLocalSemanticPanel(personId, surface = "people") {
        if (localSemanticDismissedOverlay.has(personId)) return "";
        const entry = currentLocalSemanticEntry(personId) || { status: "idle", result: null, error: null };
        const projectionViewModel = getLocalProjectionViewModel(localVaultStatus);
        const projectedPerson = projectionViewModel?.rowByPerson.get(personId) || null;
        const relationshipSuggestion = projectionViewModel?.relationshipSuggestionByPerson.get(personId) || null;
        const confirmed = projectedPerson?.boundary === "confirmed";
        const person = localVaultStatus.graph?.people?.find(item => item.id === personId);
        const relationshipState = !confirmed && projectionViewModel?.singleByPerson.get(personId)?.directRelationshipAllowed === true && relationshipSuggestion?.manualAddAllowed === true ? "relationship-direct-pending" : confirmed ? "relationship" : "ineligible";
        const directPending = relationshipState === "relationship-direct-pending";
        const heading = surface === "today" ? "聊天语义与安全草稿" : `${escapeHtml(person?.name || "该人物")} 的聊天语义`;
        const semanticActionToken = createPrivatePersonActionToken(localSemanticActionTokens, personId, `semantic-${surface}`, ["local-semantic-analyze", "local-semantic-cancel", "local-semantic-reject", "local-semantic-copy", "local-semantic-accept", "local-semantic-edit-accept", "local-semantic-draft"]);
        const semanticActionAttribute = ` data-action-token="${semanticActionToken}"`;
        const semanticSectionAttribute = `data-semantic-surface="${escapeHtml(surface)}"`;
        const semanticDraftAttribute = `data-action-token="${semanticActionToken}" data-semantic-surface="${escapeHtml(surface)}"`;
        const pendingPreview = entry.result?.identityState === "unconfirmed" && ["ready", "generic"].includes(entry.status);
        if (!confirmed && !pendingPreview) return `<section class="detail-section local-semantic-panel" ${semanticSectionAttribute}><div class="detail-section-title"><h3>${heading}</h3><span>来源尚未关联</span></div><p>${entry.status === "unconfirmed" ? "来源人物证据不足，未读取正文。" : "整库分析会自动处理可精确闭合的单一来源；人物管理状态建立前不能接受标签或准备联系，账号归属另行核对。"}</p></section>`;
        if (entry.status === "loading") return `<section class="detail-section local-semantic-panel" ${semanticSectionAttribute} role="status"><div class="detail-section-title"><h3>${heading}</h3><span>本机分析中</span></div><p>只读取当前解锁图中最多最近 400 条、80000 字的合规一对一直聊正文。</p><button class="btn" type="button" disabled aria-busy="true">分析中…</button></section>`;
        if (entry.status === "reimport-required") return `<section class="detail-section local-semantic-panel" ${semanticSectionAttribute}><div class="detail-section-title"><h3>${heading}</h3><span>证据不足</span></div><p>证据不足，请重新导入；旧记录缺少可证明的一对一直聊范围，系统不会猜测。</p><button class="btn" type="button" data-action="local-semantic-cancel"${semanticActionAttribute}>关闭</button></section>`;
        if (entry.status === "empty" || entry.status === "error") return `<section class="detail-section local-semantic-panel" ${semanticSectionAttribute}><div class="detail-section-title"><h3>${heading}</h3><span>${entry.status === "error" ? "分析未完成" : "没有合规正文"}</span></div><p>${entry.status === "error" ? "本机分析未完成；关系库没有写入，可以重试。" : "当前没有符合来源与一对一直聊边界的正文。"}</p><div class="record-actions"><button class="btn" type="button" data-action="local-semantic-analyze"${semanticActionAttribute}>重试分析聊天语义</button><button class="btn" type="button" data-action="local-semantic-cancel"${semanticActionAttribute}>关闭</button></div></section>`;
        if (["ready", "generic"].includes(entry.status) && entry.result) {
          const result = entry.result;
          const canAccept = relationshipSuggestion?.state === "suggested" && relationshipSuggestion.acceptAllowed === true;
          const canContact = confirmed && result.contactAllowed !== false;
          const rejected = localSemanticRejectedOverlay.get(personId) || new Set();
          const candidateCards = result.candidates.map((candidate, baseIndex) => ({ candidate, baseIndex })).filter(({ candidate }) => !rejected.has(candidate.label)).map(({ candidate, baseIndex }) => `<article class="record-card"><div class="record-head"><div><h3>${escapeHtml(candidate.label)}</h3><p>${canAccept ? directPending ? "接受时会一次建立人物管理状态与关系标签；账号归属另行核对" : "接受前不是关系事实" : "仅来源内预览；当前不能接受"}</p></div><span class="person-status">${canAccept ? "待确认" : "来源待关联"}</span></div>${canAccept ? `<div class="record-actions"><button class="btn btn-small btn-primary" type="button" data-action="local-semantic-accept"${semanticActionAttribute} data-candidate-index="${baseIndex}">接受</button><button class="btn btn-small" type="button" data-action="local-semantic-edit-accept"${semanticActionAttribute} data-candidate-index="${baseIndex}">修改后接受</button><button class="btn btn-small" type="button" data-action="local-semantic-reject"${semanticActionAttribute} data-candidate-index="${baseIndex}">拒绝</button></div>` : ""}</article>`).join("");
          const candidateMarkup = ["today", "modal"].includes(surface) ? "" : candidateCards || '<p class="muted">没有达到固定门槛的关系标签候选。</p>';
          const draft = localSemanticDraftOverlay.has(personId) ? localSemanticDraftOverlay.get(personId) : result.draft;
          return `<section class="detail-section local-semantic-panel" ${semanticSectionAttribute}><div class="detail-section-title"><h3>${heading}</h3><span>${canContact ? "已分析聊天语义" : directPending ? "整库分析候选 · 待你确认" : "来源内预分析 · 来源待关联"}</span></div><p><strong>${escapeHtml(result.safeAngle || "通用问候")}</strong> · 只显示安全粗粒度主题，不显示原句、命中词、ID 或评分。</p>${candidateMarkup}<label for="localSemanticDraft">${canContact ? "可编辑安全草稿" : "安全草稿预览（保存标签前不可使用）"}</label><textarea id="localSemanticDraft" ${semanticDraftAttribute} ${canContact ? "" : "readonly"}>${escapeHtml(draft)}</textarea><div class="record-actions">${canContact ? `<button class="btn" type="button" data-action="local-semantic-copy"${semanticActionAttribute}>复制草稿</button><button class="btn" type="button" data-action="local-semantic-analyze"${semanticActionAttribute}>重新分析</button>` : ""}<button class="btn" type="button" data-action="local-semantic-cancel"${semanticActionAttribute}>关闭</button></div><p>${canContact ? "复制不等于发送；只有你确认“我已在外部发送”后才沿原联系闭环记录最终编辑文本。" : directPending ? "候选来自已完成的整库聊天分析；接受或手工保存第一个标签后，才会建立人物管理状态并写入关系事实；账号归属不随之改变。" : "这不是来源归属或关系事实；当前不能接受标签、复制或准备联系。"}</p></section>`;
        }
        return `<section class="detail-section local-semantic-panel" ${semanticSectionAttribute}><div class="detail-section-title"><h3>${heading}</h3><span>等待整库分析</span></div><p>整库分析会自动读取本机合规一对一直聊；你也可以单独重试这个人物。</p><button class="btn btn-primary" type="button" data-action="local-semantic-analyze"${semanticActionAttribute}>分析聊天语义</button></section>`;
      }

      function renderSourceBadges(sourceBadges = []) {
        const safeSuiyinLabel = label => {
          if (label === "碎银 · 账号待补") return true;
          if (!label.startsWith("碎银 · ")) return false;
          const systemName = label.slice(5);
          return [...systemName].length >= 1
            && [...systemName].length <= 64
            && !/[\u0000-\u001F\u007F-\u009F\u200B-\u200F\u202A-\u202E\u2060-\u206F]/u.test(systemName)
            && !/[*＊]/u.test(systemName)
            && !/\b[A-Z]{2}-[0-9A-F]{8}\b/iu.test(systemName)
            && !/^(?:wxid_|gh_)/iu.test(systemName)
            && !/^(?:[0-9A-F]{32,64}|[0-9A-F]{8}(?:-[0-9A-F]{4}){3}-[0-9A-F]{12}|[0-9]{8,}|unknown|tbd|待补|账号待补|未知|未命名)$/iu.test(systemName);
        };
        const badges = Array.isArray(sourceBadges) ? [...new Map(sourceBadges
          .filter(item => {
            if (!item || typeof item.label !== "string") return false;
            const label = item.label.trim();
            if (item.kind === "wechat") return label === "微信" || label === "微信导出 · 归属待核对";
            if (item.kind === "suiyin") return safeSuiyinLabel(label);
            if (item.kind === "conflict") return label === "来源冲突 · 请修复";
            return item.kind === "unknown" && label === "来源未识别 · 请重导";
          })
          .map(item => [`${item.kind}\0${item.label.trim()}`, { kind: item.kind, label: item.label.trim() }])).values()] : [];
        return badges.length
          ? `<div class="source-badge-row" aria-label="数据来源">${badges.map(item => `<span class="source-badge ${item.kind === "suiyin" ? "is-suiyin" : ""}">${escapeHtml(item.label)}</span>`).join("")}</div>`
          : '<div class="source-badge-row"><span class="source-badge">来源未识别 · 请重导</span></div>';
      }

      function renderSourceBadgeHelp() {
        return '<p class="dialog-help">人物标签显示同一份账号归属投影：私人微信显示“微信”，碎银账号按官方人设名称区分；只有聊天采集渠道、尚无账号证据时显示“微信导出 · 归属待核对”。缺失或冲突会明确提示，不会猜测号位。</p>';
      }

      function renderPersonFlowDialog() {
        if (!personFlowState.open) return;
        const graph = localVaultStatus.graph;
        const saving = personFlowState.status === "saving";
        const closeButton = personFlowBackdrop.querySelector('[data-action="person-flow-close"]');
        if (closeButton) closeButton.disabled = saving;
        if (personFlowState.phase === "identity" && personFlowState.mode === "pair") {
          const item = personFlowState.pair;
          const decided = item?.status && item.status !== "pending";
          personFlowTitle.textContent = decided ? "跨来源身份决定" : "确认是否为同一个人";
          personFlowSubtitle.textContent = "只有不同来源的两侧真实身份同时展示时，才可以保持为两个人。";
          personFlowDescription.innerHTML = `<section class="detail-section"><div class="person-flow-sides"><div class="person-flow-side"><strong>${escapeHtml(item?.left?.displayName || "左侧身份")}</strong>${renderSourceBadges(item?.left?.sourceBadges)}</div><div class="person-flow-bridge">${decided ? item.status === "merged" ? "已确认同一人" : "已保持两个人" : "昵称精确相同<br>仍需人工确认"}</div><div class="person-flow-side"><strong>${escapeHtml(item?.right?.displayName || "右侧身份")}</strong>${renderSourceBadges(item?.right?.sourceBadges)}</div></div><p>${decided ? "撤销后会重新回到待确认；关系标签不会被自动新增。" : "确认是同一个人会原子合并两侧人物引用；保持为两个人只记录这个 pair 的人工决定，不会改写关系标签。"}</p>${personFlowState.error === "RELATIONSHIP_REFRESH_FAILED" ? '<p class="person-flow-status is-error" role="alert">跨来源身份决定已保存，但聊天分析刷新失败；请重试分析。</p>' : personFlowState.error ? '<p class="person-flow-status is-error" role="alert">决定没有完成；原跨来源与关系状态没有改变，可以重试。</p>' : ""}<div class="record-actions"><button class="btn" type="button" data-action="person-flow-close" ${saving ? "disabled" : ""}>取消</button>${decided ? `<button class="btn btn-primary" type="button" data-action="person-flow-undo-pair" ${saving ? 'disabled aria-busy="true"' : ""}>${saving ? "正在加密保存…" : "撤销这个决定"}</button>` : `<button class="btn" type="button" data-action="person-flow-separate-pair" ${saving ? "disabled" : ""}>保持为两个人</button><button class="btn btn-primary" type="button" data-action="person-flow-merge-pair" ${saving ? 'disabled aria-busy="true"' : ""}>${saving ? "正在加密保存…" : "确认是同一个人"}</button>`}</div></section>`;
          return;
        }
        const person = graph ? getLocalProjectionViewModel(localVaultStatus)?.rowByPerson.get(personFlowState.personId) : null;
        personFlowTitle.textContent = `${person?.displayName || "这个人物"} 的关系标签`;
        personFlowSubtitle.textContent = "已用整库聊天分析准备候选；接受前不是关系事实。";

        dialogConfirm.textContent = "正在保存…";

      function buildSuiyinScopeViewModel(aggregate) {
        if (!aggregate || typeof aggregate !== "object" || Array.isArray(aggregate)) return null;
        const count = field => Number.isInteger(aggregate[field]) && aggregate[field] >= 0 ? aggregate[field] : null;
        const safeOfficialLabel = value => {
          const label = typeof value === "string" ? value.trim() : "";
          if (!label || [...label].length > 64 || /[\u0000-\u001F\u007F-\u009F\u200B-\u200F\u202A-\u202E\u2060-\u206F]/u.test(label)) return null;
          if (/[*＊]/u.test(label) || /\b[A-Z]{2}-[0-9A-F]{8}\b/iu.test(label) || /^(?:wxid_|gh_)/iu.test(label)) return null;
          if (/^(?:[0-9A-F]{32,64}|[0-9A-F]{8}(?:-[0-9A-F]{4}){3}-[0-9A-F]{12}|[0-9]{8,}|unknown|tbd|待补|账号待补|未知|未命名)$/iu.test(label)) return null;
          return label;
        };
        const perPersona = Array.isArray(aggregate.perPersona) ? aggregate.perPersona.flatMap(item => {
          if (!item || typeof item !== "object" || Array.isArray(item)) return [];
          const officialLabel = safeOfficialLabel(item.officialLabel);
          const fields = ["friendCount", "groupCount", "messageCount", "unreadableCount", "failureCount"];
          if (!officialLabel || !fields.every(field => Number.isInteger(item[field]) && item[field] >= 0) || typeof item.complete !== "boolean") return [];
          return [Object.freeze({ officialLabel, ...Object.fromEntries(fields.map(field => [field, item[field]])), complete: item.complete })];
        }) : [];
        const scopeKind = aggregate.scopeKind === "persona-complete-v1" || aggregate.scopeKind === "current-allocation-partial-v1" ? aggregate.scopeKind : "legacy-unknown";
        const scopeComplete = aggregate.scopeComplete === true;
        const personaDeclaredCount = count("personaDeclaredCount");
        const personaReadCount = count("personaReadCount");
        const allocationDeclaredCount = count("allocationDeclaredCount");
        const allocationCount = count("allocationCount");
        const allocationMissingCount = count("allocationMissingCount");
        const customerCount = count("customerCount");
        const friendCount = count("friendCount");
        const groupCount = count("groupCount");
        const messageCount = count("messageCount");
        const unreadableCount = count("unreadableCount");
        const failureCount = count("failureCount");
        const missingDisplayNameCount = count("missingDisplayNameCount");
        const excludedCount = count("excludedCount");
        const allCountsKnown = [personaDeclaredCount, personaReadCount, allocationDeclaredCount, allocationCount, allocationMissingCount, customerCount, friendCount, groupCount, messageCount, unreadableCount, failureCount, missingDisplayNameCount, excludedCount].every(value => value !== null);
        const allocationReceiptClosed = allocationDeclaredCount !== null && allocationCount !== null && allocationMissingCount !== null
          && allocationDeclaredCount >= allocationCount && allocationDeclaredCount - allocationCount === allocationMissingCount
          && customerCount === allocationCount && friendCount + groupCount + missingDisplayNameCount === customerCount;
        const personaRosterClosed = personaDeclaredCount === 3 && personaReadCount === 3 && perPersona.length === 3
          && new Set(perPersona.map(item => item.officialLabel)).size === 3;
        const partialConfirmEnabled = scopeKind === "current-allocation-partial-v1" && scopeComplete === false
          && aggregate.completeScopeUnavailableReason === "UPSTREAM_PERSONA_COHORT_UNAVAILABLE"
          && allCountsKnown && allocationReceiptClosed && personaRosterClosed && failureCount === 0;
        const completeConfirmEnabled = scopeKind === "persona-complete-v1" && scopeComplete === true
          && allCountsKnown && personaRosterClosed && failureCount === 0 && perPersona.every(item => item.complete === true);
        return Object.freeze({
          scopeKind,
          scopeComplete,
          completeScopeUnavailableReason: aggregate.completeScopeUnavailableReason === "UPSTREAM_PERSONA_COHORT_UNAVAILABLE" ? aggregate.completeScopeUnavailableReason : null,
          personaDeclaredCount,
          personaReadCount,
          allocationDeclaredCount,
          allocationCount,
          allocationMissingCount,
          customerCount,
          friendCount,
          groupCount,
          messageCount,
          unreadableCount,
          failureCount,
          missingDisplayNameCount,
          excludedCount,
          perPersona: Object.freeze(perPersona),
          partialConfirmEnabled,
          completeConfirmEnabled,
        });
      }

      function renderSuiyinScopeReceipt(aggregate, { mode = "idle" } = {}) {
        const scope = buildSuiyinScopeViewModel(aggregate);
        if (!scope) return "";
        const shown = value => Number.isInteger(value) ? String(value) : "未记录";
        const partial = scope.scopeKind === "current-allocation-partial-v1" && scope.scopeComplete === false;
        const complete = scope.scopeKind === "persona-complete-v1" && scope.scopeComplete === true;
        const officialRows = scope.perPersona.map(persona => `<div class="relation-row"><div><strong>碎银 · ${escapeHtml(persona.officialLabel)}</strong><p class="muted">好友人物 ${persona.friendCount} · 群上下文 ${persona.groupCount} · 可读消息条数 ${persona.messageCount} · 不可读取 ${persona.unreadableCount} · 失败 ${persona.failureCount}</p></div><span class="mini-pill">${persona.complete ? "范围完整" : "当前分配片段"}</span></div>`).join("");
        const scopeSummary = partial
          ? `当前分配声明 ${shown(scope.allocationDeclaredCount)}、实际读取 ${shown(scope.allocationCount)}、缺失 ${shown(scope.allocationMissingCount)}；其中好友人物 ${shown(scope.friendCount)}、群上下文 ${shown(scope.groupCount)}。`
          : complete
            ? `${shown(scope.personaReadCount)}/${shown(scope.personaDeclaredCount)} 个账号范围完整；好友人物 ${shown(scope.friendCount)}、群上下文 ${shown(scope.groupCount)}。`
            : "旧版碎银来源未记录完整范围；重新读取前不会补造统计。";
        const blockedReason = "当前接口只能读取“当前分配”；可修正当前对象，但尚不能证明三账号好友完整";
        const previewActions = mode === "preview"
          ? partial
            ? `<button class="btn btn-primary" type="button" data-action="suiyin-import-confirm" ${scope.partialConfirmEnabled ? "" : "disabled"}>只更新当前分配（不是三账号全量）</button><button class="btn" type="button" disabled>确认三账号完整导入</button>`
            : complete
              ? `<button class="btn btn-primary" type="button" data-action="suiyin-import-confirm" ${scope.completeConfirmEnabled ? "" : "disabled"}>确认三账号完整导入</button>`
              : '<button class="btn" type="button" disabled>当前范围回执不完整</button>'
          : partial ? '<button class="btn" type="button" disabled>确认三账号完整导入</button>' : "";

      function renderUnifiedSourceCoverageReceipt(receipt, { sourceKind = "unknown" } = {}) {
        const metricOrder = Object.freeze([
          Object.freeze(["friends", "好友"]),
          Object.freeze(["directConversations", "1 对 1 聊天"]),
          Object.freeze(["directMessages", "1 对 1 消息"]),
          Object.freeze(["groupConversations", "群聊"]),
          Object.freeze(["groupMessages", "群消息"]),
          Object.freeze(["moments", "朋友圈内容"]),
        ]);
        const allowedStates = new Set(["exact", "partial", "legacy-unknown", "upstream-unsupported", "blocked"]);
        const legacyMetric = () => Object.freeze({ value: null, state: "legacy-unknown", reason: null });
        const metricKeys = receipt?.metrics && typeof receipt.metrics === "object" && !Array.isArray(receipt.metrics) ? Object.keys(receipt.metrics) : [];
        const exactShape = receipt?.version === 1 && metricKeys.length === metricOrder.length && metricOrder.every(([key]) => metricKeys.includes(key));
        const metrics = Object.fromEntries(metricOrder.map(([key]) => {
          const candidate = exactShape ? receipt.metrics[key] : null;
          const candidateState = allowedStates.has(candidate?.state) ? candidate.state : "legacy-unknown";
          const state = sourceKind === "suiyin" && candidateState === "upstream-unsupported" ? "blocked" : candidateState;
          const numericState = state === "exact" || state === "partial";
          const legalValue = numericState ? Number.isInteger(candidate?.value) && candidate.value >= 0 : candidate?.value === null;
          if (!legalValue) return [key, legacyMetric()];
          return [key, Object.freeze({ value: numericState ? candidate.value : null, state, reason: typeof candidate?.reason === "string" ? candidate.reason : null })];
        }));
        const safeReasonCopy = Object.freeze({
          WECHAT_ROSTER_NOT_PROVIDED: "完整好友数：当前导出未提供可信好友清单",
          WECHAT_MOMENTS_NOT_PROVIDED: "当前导出未提供朋友圈文件",
          LOCAL_SUIYIN_MOMENTS_MAPPING_PENDING: "现有碎银读取能力尚未形成可验证的朋友圈回执",
          LOCAL_SUIYIN_SCHEMA_PENDING: "本地适配尚未形成可验证的字段映射",
          LOCAL_SUIYIN_PAGINATION_PENDING: "本地适配尚未形成可验证的分页回执",
          LOCAL_SUIYIN_PERMISSION_BLOCKED: "本地读取权限尚未闭合",
          LOCAL_SUIYIN_RECEIPT_PENDING: "本地适配尚未形成可验证的范围回执",
        });
        const stateCopy = Object.freeze({
          exact: "本范围完整",
          partial: "当前已读",
          "legacy-unknown": "旧版导入未记录",
          "upstream-unsupported": "上游不支持",
          blocked: "受阻",
        });
        const metricMarkup = metricOrder.map(([key, label]) => {
          const metric = metrics[key] || legacyMetric();
          const value = metric.state === "exact" || metric.state === "partial" ? String(metric.value) : "—";
          const detail = safeReasonCopy[metric.reason] || (metric.state === "blocked" && sourceKind === "suiyin" ? "本地适配/映射尚未形成可验证回执" : stateCopy[metric.state]);
          return `<div class="source-coverage-metric" data-metric-key="${key}" data-metric-state="${metric.state}"><span>${label}</span><strong>${value}</strong><small>${escapeHtml(detail)}</small></div>`;
        }).join("");
        const notes = [];
        if (sourceKind === "wechat" && metrics.friends?.state === "blocked") notes.push("完整好友数：当前导出未提供可信好友清单");
        if (sourceKind === "wechat" && Number.isInteger(receipt?.observedDirectParticipantCount) && receipt.observedDirectParticipantCount >= 0) notes.push(`本批次单聊中出现 ${receipt.observedDirectParticipantCount} 人`);
        if (sourceKind === "suiyin" && receipt?.scopeKind === "suiyin-current-allocation-partial-v1") notes.push("当前已读片段，不代表三个账号完整范围");
        if (Number.isInteger(receipt?.excludedCount) && receipt.excludedCount > 0) notes.push(`另有 ${receipt.excludedCount} 条排除项，不并入六项`);
        return `<section class="source-coverage" aria-label="六项来源覆盖回执"><div class="source-coverage-grid">${metricMarkup}</div>${notes.map(note => `<p class="source-coverage-note">${escapeHtml(note)}</p>`).join("")}</section>`;
      }

      function normalizeActiveSuiyinCapabilityBoundary(markup) {

        const filterActive = selected.size > 0 || String(search).trim() || identity !== "all" || classification !== "all";
        const emptyCopy = result?.error === true ? "朋友圈内容暂时无法读取；本机关系库没有改变。" : filterActive ? "没有同时匹配当前来源和搜索条件的朋友圈" : "当前加密关系图中没有可显示的真实朋友圈";

t} 页 · 共 ${total} 条</span><button class="btn" type="button" data-action="real-signal-page" data-page-value="${Math.min(pageCount, page + 1)}" ${page >= pageCount ? "disabled" : ""}>下一页</button></div></div></section>`;
