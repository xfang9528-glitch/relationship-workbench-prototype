<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>关系·今天 — 本地原型</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f2ed;
      --panel: #fbfaf7;
      --panel-strong: #ffffff;
      --line: #e4e1d8;
      --line-strong: #d5d0c4;
      --text: #20231f;
      --text-soft: #676c64;
      --text-faint: #8a8f87;
      --green: #376b55;
      --green-strong: #23533f;
      --green-soft: #e7f0ea;
      --amber: #8b612b;
      --amber-soft: #f6ead9;
      --blue: #4b6887;
      --blue-soft: #e7edf3;
      --rose: #8a5a58;
      --rose-soft: #f3e8e6;
      --shadow: 0 18px 48px rgba(38, 43, 36, .08);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 13px;
      --radius-sm: 9px;
      --sidebar: 218px;
      --queue: 390px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    button, [role="button"] { -webkit-tap-highlight-color: transparent; }
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid rgba(55, 107, 85, .28);
      outline-offset: 2px;
    }

    .app-shell {
      height: 100vh;
      min-width: 1080px;
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
    }

    .sidebar {
      background: #ebe9e2;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      padding: 24px 16px 18px;
      min-height: 0;
    }

    .brand { padding: 0 10px 22px; }
    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--green-strong);
      box-shadow: 0 8px 18px rgba(35, 83, 63, .18);
      font-family: Georgia, serif;
      font-size: 20px;
      margin-bottom: 13px;
    }
    .brand h1 { font-size: 20px; line-height: 1.2; margin: 0; letter-spacing: .02em; }
    .brand p { color: var(--text-soft); font-size: 12px; margin: 5px 0 0; }

    .nav-label {
      color: var(--text-faint);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      padding: 0 12px 7px;
      text-transform: uppercase;
    }
    .nav-stack { display: grid; gap: 5px; }
    .nav-button {
      width: 100%;
      border: 0;
      background: transparent;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      transition: background .16s ease, color .16s ease;
    }
    .nav-button:hover { background: rgba(255, 255, 255, .55); }
    .nav-button.is-active { background: var(--panel-strong); color: var(--green-strong); box-shadow: 0 3px 12px rgba(50, 56, 48, .05); }
    .nav-icon { width: 22px; text-align: center; font-size: 16px; }
    .nav-text { flex: 1; font-weight: 650; }
    .nav-count {
      min-width: 22px;
      height: 20px;
      padding: 0 6px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: var(--text-soft);
      background: rgba(255, 255, 255, .55);
      font-size: 11px;
    }
    .nav-button.is-active .nav-count { color: var(--green-strong); background: var(--green-soft); }

    .sidebar-spacer { flex: 1; min-height: 24px; }
    .prototype-lab {
      border-top: 1px solid var(--line-strong);
      padding: 16px 8px 0;
    }
    .prototype-lab label { display: block; color: var(--text-soft); font-size: 12px; margin-bottom: 7px; }
    .prototype-lab select {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: rgba(255, 255, 255, .64);
      padding: 8px 30px 8px 10px;
      color: var(--text);
    }
    .lab-note { color: var(--text-faint); font-size: 11px; margin: 7px 0 0; }

    .workspace { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .topbar {
      min-height: 68px;
      padding: 13px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(251, 250, 247, .82);
      backdrop-filter: blur(16px);
    }
    .privacy-strip { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .privacy-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 5px var(--green-soft); }
    .privacy-copy strong { display: block; font-size: 13px; }
    .privacy-copy span { color: var(--text-soft); font-size: 12px; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .date-copy { color: var(--text-soft); font-size: 12px; margin-right: 6px; }

    .btn {
      border: 1px solid var(--line-strong);
      background: var(--panel-strong);
      border-radius: 11px;
      padding: 9px 13px;
      font-weight: 650;
      cursor: pointer;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }
    .btn:hover { border-color: #bdb8ab; }
    .btn:active { transform: translateY(1px); }
    .btn-primary { border-color: var(--green-strong); color: #fff; background: var(--green-strong); }
    .btn-primary:hover { background: #1c4836; border-color: #1c4836; }
    .btn-soft { border-color: transparent; color: var(--green-strong); background: var(--green-soft); }
    .btn-quiet { border-color: transparent; background: transparent; color: var(--text-soft); }
    .btn-danger-soft { border-color: transparent; color: var(--rose); background: var(--rose-soft); }
    .btn-small { padding: 6px 9px; border-radius: 9px; font-size: 12px; }
    .btn:disabled { cursor: not-allowed; opacity: .46; transform: none; }

    .page-host { min-height: 0; min-width: 0; overflow: hidden; }
    .today-layout {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-columns: var(--queue) minmax(520px, 1fr);
    }
    .queue-panel { min-width: 0; min-height: 0; border-right: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); }
    .queue-head { padding: 24px 22px 16px; border-bottom: 1px solid var(--line); }
    .eyebrow { color: var(--green); font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .queue-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-top: 5px; }
    .queue-head h2 { font-size: 23px; line-height: 1.25; margin: 0; }
    .queue-head p { color: var(--text-soft); margin: 6px 0 0; font-size: 13px; }
    .batch-switch { display: inline-flex; gap: 3px; padding: 3px; border-radius: 11px; background: #e9e7df; }
    .batch-button { border: 0; border-radius: 8px; background: transparent; padding: 6px 10px; color: var(--text-soft); cursor: pointer; font-weight: 650; font-size: 12px; }
    .batch-button.is-active { background: #fff; color: var(--text); box-shadow: 0 2px 6px rgba(31, 35, 30, .08); }

    .queue-scroll { min-height: 0; overflow: auto; padding: 16px 14px 30px; }
    .queue-section + .queue-section { margin-top: 22px; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 8px; }
    .section-heading h3 { font-size: 12px; margin: 0; letter-spacing: .04em; }
    .section-heading span { color: var(--text-faint); font-size: 11px; }
    .count-adjust { display: inline-flex; align-items: center; gap: 5px; }
    .count-adjust span { min-width: 34px; color: var(--text-soft); text-align: center; }
    .count-button { width: 25px; height: 25px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; line-height: 1; }
    .count-button:disabled { cursor: not-allowed; opacity: .42; }
    .candidate-list { display: grid; gap: 8px; }
    .candidate-card {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 15px;
      background: transparent;
      padding: 12px;
      text-align: left;
      cursor: pointer;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 11px;
      align-items: start;
      transition: background .14s ease, border-color .14s ease, box-shadow .14s ease;
    }
    .candidate-card:hover { background: #fff; border-color: var(--line); }
    .candidate-card.is-selected { background: #fff; border-color: #b9cfc2; box-shadow: 0 8px 22px rgba(46, 73, 59, .08); }
    .candidate-card:disabled { cursor: not-allowed; opacity: .56; background: #f4f2ec; }
    .avatar { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; color: #fff; font-weight: 800; background: var(--avatar, #6c8075); }
    .candidate-copy { min-width: 0; }
    .candidate-name-row { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .candidate-name { font-weight: 760; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-pill { border-radius: 999px; padding: 2px 7px; color: var(--text-soft); background: #efeee8; font-size: 10px; white-space: nowrap; }
    .candidate-meta { color: var(--text-faint); font-size: 11px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .candidate-reason { color: var(--text-soft); font-size: 12px; margin-top: 7px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .candidate-arrow { color: var(--text-faint); padding-top: 9px; }
    .reason-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
    .reason-tag { border-radius: 7px; padding: 2px 6px; font-size: 10px; font-weight: 700; }
    .reason-significance { color: var(--green-strong); background: var(--green-soft); }
    .reason-fade { color: var(--amber); background: var(--amber-soft); }
    .reason-timing { color: var(--blue); background: var(--blue-soft); }
    .reason-feedback { color: var(--rose); background: var(--rose-soft); }

    .show-more { width: calc(100% - 16px); margin: 12px 8px 0; border: 1px dashed var(--line-strong); background: transparent; color: var(--text-soft); border-radius: 12px; padding: 9px; cursor: pointer; }
    .show-more:hover { border-color: var(--green); color: var(--green-strong); background: var(--green-soft); }

    .detail-panel { min-width: 0; min-height: 0; background: var(--panel-strong); overflow: auto; }
    .detail-inner { max-width: 880px; margin: 0 auto; padding: 30px 38px 60px; }
    .empty-detail { height: 100%; min-height: 480px; display: grid; place-items: center; padding: 50px; color: var(--text-soft); text-align: center; }
    .empty-detail-art { width: 74px; height: 74px; margin: 0 auto 18px; border-radius: 24px; display: grid; place-items: center; color: var(--green); background: var(--green-soft); font-size: 28px; }
    .empty-detail h2 { color: var(--text); font-size: 20px; margin: 0; }
    .empty-detail p { max-width: 380px; margin: 8px auto 0; }

    .person-hero { display: flex; align-items: flex-start; gap: 16px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
    .person-hero .avatar { width: 58px; height: 58px; border-radius: 19px; font-size: 18px; flex: 0 0 auto; }
    .person-identity { min-width: 0; flex: 1; }
    .person-identity h2 { font-size: 24px; line-height: 1.2; margin: 2px 0 5px; }
    .person-identity p { color: var(--text-soft); margin: 0; }
    .person-status { color: var(--green-strong); background: var(--green-soft); border-radius: 999px; padding: 5px 9px; font-size: 11px; font-weight: 750; }

    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0 0; }
    .summary-cell { border: 1px solid var(--line); border-radius: 13px; padding: 11px 12px; background: #fcfbf8; }
    .summary-cell span { display: block; color: var(--text-faint); font-size: 10px; margin-bottom: 2px; }
    .summary-cell strong { font-size: 12px; }

    .detail-section { margin-top: 25px; }
    .detail-section-title { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
    .detail-section h3 { font-size: 14px; margin: 0; }
    .detail-section-title span { color: var(--text-faint); font-size: 11px; }
    .reason-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .reason-card { border-radius: 14px; padding: 13px; min-height: 94px; border: 1px solid var(--line); background: #fcfbf8; }
    .reason-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .reason-card strong { font-size: 12px; }
    .evidence-label { color: var(--text-faint); font-size: 10px; }
    .reason-card p { color: var(--text-soft); font-size: 12px; margin: 7px 0 0; }

    .boundary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .boundary-card { border-radius: 16px; padding: 15px; border: 1px solid var(--line); }
    .boundary-card.private { background: #f5f0e9; }
    .boundary-card.public { background: #edf4ef; border-color: #d3e4d8; }
    .boundary-kicker { font-size: 11px; font-weight: 800; margin-bottom: 7px; }
    .boundary-card.private .boundary-kicker { color: var(--amber); }
    .boundary-card.public .boundary-kicker { color: var(--green-strong); }
    .boundary-card p { margin: 0; font-size: 13px; }
    .boundary-note { color: var(--text-faint); font-size: 11px; margin-top: 8px; }

    .detail-actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 18px; }
    .channel-row { display: flex; gap: 7px; flex-wrap: wrap; }
    .channel-button { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 7px 10px; color: var(--text-soft); cursor: pointer; }
    .channel-button.is-active { color: var(--green-strong); border-color: #a8c4b3; background: var(--green-soft); font-weight: 700; }

    .draft-card { margin-top: 12px; border: 1px solid var(--line); border-radius: 17px; background: #fcfbf8; overflow: hidden; }
    .draft-head { padding: 11px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
    .draft-head strong { font-size: 12px; }
    .mock-badge { color: var(--blue); background: var(--blue-soft); border-radius: 999px; padding: 2px 7px; font-size: 10px; font-weight: 750; }
    .draft-card textarea { width: 100%; min-height: 118px; resize: vertical; border: 0; background: transparent; padding: 15px; color: var(--text); outline: 0; line-height: 1.75; }
    .draft-foot { padding: 10px 12px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .draft-status { color: var(--text-faint); font-size: 11px; }
    .draft-tools { display: flex; gap: 6px; }
    .preference-box { margin-top: 10px; border-radius: 12px; padding: 10px 12px; color: var(--green-strong); background: var(--green-soft); display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; }

    .truth-note { display: flex; gap: 10px; align-items: flex-start; border-radius: 14px; padding: 12px 13px; color: var(--text-soft); background: #f2f1ec; font-size: 12px; margin-top: 12px; }
    .truth-note strong { color: var(--text); }

    .timeline { position: relative; display: grid; gap: 0; }
    .timeline::before { content: ""; position: absolute; top: 10px; bottom: 10px; left: 7px; width: 1px; background: var(--line-strong); }
    .timeline-item { position: relative; display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 11px; padding: 0 0 17px; }
    .timeline-dot { position: relative; z-index: 1; width: 15px; height: 15px; margin-top: 2px; border: 4px solid var(--panel-strong); border-radius: 50%; background: var(--green); box-shadow: 0 0 0 1px var(--line-strong); }
    .timeline-copy { min-width: 0; }
    .timeline-copy strong { font-size: 12px; }
    .timeline-copy time { color: var(--text-faint); font-size: 10px; margin-left: 6px; }
    .timeline-copy p { color: var(--text-soft); font-size: 12px; margin: 3px 0 0; }
    .timeline-type { color: var(--green-strong); font-size: 10px; font-weight: 800; margin-right: 6px; }
    .timeline-details { min-width: 0; }
    .timeline-summary { display: flex; align-items: center; gap: 6px; cursor: pointer; list-style: none; border-radius: 7px; }
    .timeline-summary::-webkit-details-marker { display: none; }
    .timeline-summary:focus-visible { outline: 3px solid rgba(55, 107, 85, .28); outline-offset: 3px; }
    .timeline-toggle { margin-left: auto; color: var(--green-strong); font-size: 11px; font-weight: 700; }
    .timeline-collapse-text { display: none; }
    .timeline-details[open] .timeline-expand-text { display: none; }
    .timeline-details[open] .timeline-collapse-text { display: inline; }

    .response-form { display: grid; gap: 10px; }
    .form-field label { display: block; color: var(--text-soft); font-size: 11px; font-weight: 700; margin-bottom: 5px; }
    .form-field input, .form-field textarea, .form-field select {
      width: 100%;
      border: 1px solid var(--line-strong);
      background: #fff;
      border-radius: 10px;
      padding: 9px 10px;
      color: var(--text);
    }
    .form-field textarea { min-height: 76px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .standard-page { height: 100%; min-height: 0; overflow: auto; padding: 30px 36px 60px; }
    .page-frame { max-width: 1160px; margin: 0 auto; }
    .page-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 30px; margin-bottom: 24px; }
    .page-title-row h2 { font-size: 26px; margin: 2px 0 5px; }
    .page-title-row p { color: var(--text-soft); margin: 0; max-width: 650px; }
    .people-filter-tools { display: flex; align-items: flex-start; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
    .people-location-filter { position: relative; min-width: 180px; }
    .people-location-filter summary { list-style: none; cursor: pointer; border: 1px solid var(--line-strong); background: #fff; border-radius: 11px; padding: 9px 30px 9px 11px; color: var(--text); min-height: 39px; }
    .people-location-filter summary::-webkit-details-marker { display: none; }
    .people-location-filter summary::after { content: "⌄"; position: absolute; right: 11px; top: 9px; color: var(--text-faint); }
    .people-location-filter[open] summary { border-color: var(--green); box-shadow: 0 0 0 2px rgba(27, 91, 70, .08); }
    .people-location-options { position: absolute; z-index: 8; top: calc(100% + 6px); right: 0; width: max-content; min-width: 220px; max-width: 320px; max-height: 280px; overflow: auto; padding: 8px; border: 1px solid var(--line-strong); border-radius: 12px; background: #fff; box-shadow: 0 12px 30px rgba(20, 37, 31, .13); }
    .people-location-option { display: flex; align-items: flex-start; gap: 8px; padding: 7px 8px; border-radius: 8px; color: var(--text); font-size: 12px; }
    .people-location-option:hover { background: var(--green-soft); }
    .people-location-option input { margin-top: 2px; }
    .metric-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .metric-card { border: 1px solid var(--line); border-radius: 17px; background: var(--panel-strong); padding: 16px; }
    .metric-card span { display: block; color: var(--text-faint); font-size: 11px; }
    .metric-card strong { display: block; font-size: 24px; line-height: 1.2; margin-top: 4px; }
    .metric-card small { color: var(--text-soft); }
    .content-card { border: 1px solid var(--line); border-radius: 18px; background: var(--panel-strong); overflow: hidden; }
    .content-card + .content-card { margin-top: 14px; }
    .content-card-head { padding: 14px 17px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .content-card-head h3 { font-size: 14px; margin: 0; }
    .content-card-body { padding: 16px 17px; }
    .search-box { width: 280px; max-width: 100%; border: 1px solid var(--line-strong); background: #fff; border-radius: 11px; padding: 9px 11px; }

    .people-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .people-table thead { position: sticky; top: 0; z-index: 2; background: var(--panel-strong); }
    .people-table th { color: var(--text-faint); font-size: 10px; letter-spacing: .04em; text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    .people-table th:nth-child(1) { width: 22%; }
    .people-table th:nth-child(2) { width: 18%; }
    .people-table th:nth-child(3) { width: 18%; }
    .people-table th:nth-child(4) { width: 12%; }
    .people-table th:nth-child(5) { width: 12%; }
    .people-table th:nth-child(6) { width: 18%; }
    .people-table td { padding: 11px 10px; border-bottom: 1px solid #efede7; vertical-align: middle; }
    .people-table tr[data-people-row] { height: 96px; }
    .people-table tr[data-people-row] td { height: 96px; overflow: hidden; }
    .people-cell-clip { max-height: 72px; overflow: hidden; overflow-wrap: anywhere; }
    .people-cell-clip > strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .people-cell-clip .record-actions { max-height: 64px; overflow: hidden; }
    .collection-location-list { display: flex; flex-wrap: wrap; gap: 5px; max-height: 62px; overflow: hidden; }
    .collection-location-chip { display: inline-flex; align-items: center; min-width: 0; max-width: 100%; border: 1px solid #cfe0d7; border-radius: 999px; padding: 3px 8px; background: #f1f7f4; color: var(--green); font-size: 11px; line-height: 1.2; }
    .collection-location-chip.is-review { border-color: #e4d9c7; background: #faf7f0; color: #806a47; }
    .people-virtual-spacer td { height: 0; padding: 0; border: 0; background: transparent !important; }
    .people-table tr:last-child td { border-bottom: 0; }

    .moments-boundary { border: 1px solid #c8d8ce; border-radius: 16px; background: #f6fbf7; padding: 14px 16px; color: var(--green-strong); margin-bottom: 16px; }

    .real-moment-source-option:has(input:checked) { border-color: #b9d1c2; background: var(--green-soft); color: var(--green-strong); }
    .real-moment-pagination { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .moment-card { border: 1px solid var(--line); border-radius: 15px; background: #fff; padding: 14px; min-width: 0; }
    .moment-card.is-internal { background: #fbfaf6; }
    .moment-card.is-sensitive { background: #fff8f4; border-color: #ead6c8; }

    .moment-head, .moment-meta, .moment-actions, .topic-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .moment-meta { justify-content: flex-start; color: var(--text-faint); font-size: 11px; margin: 5px 0 9px; }
    .moment-body { color: var(--text-soft); line-height: 1.65; overflow-wrap: anywhere; max-height: 88px; overflow: auto; }

    .moment-insights { display: grid; gap: 8px; margin: 12px 0; }
    .moment-insight { border-left: 3px solid #c8d8ce; padding: 7px 10px; background: #f8faf8; border-radius: 0 10px 10px 0; }
    .moment-insight strong { display: block; font-size: 11px; color: var(--green-strong); }
    .prepared-topic { border: 1px solid #c8d8ce; background: #f6fbf7; border-radius: 13px; padding: 12px; margin-top: 10px; }
    .prepared-topic p { margin: 7px 0; color: var(--text-soft); overflow-wrap: anywhere; }
    .privacy-manifest { border-radius: 18px; padding: 18px; color: #e9f4ed; background: #254f3e; margin-bottom: 16px; display: flex; gap: 16px; justify-content: space-between; align-items: center; }
    .privacy-manifest h3 { color: #fff; margin: 0 0 4px; }

    .state-card { min-height: 390px; border: 1px solid var(--line); border-radius: 20px; background: #fff; display: grid; place-items: center; text-align: center; padding: 40px; }
    .state-card-inner { max-width: 430px; }
    .state-icon { width: 62px; height: 62px; display: grid; place-items: center; margin: 0 auto 15px; border-radius: 20px; color: var(--green); background: var(--green-soft); font-size: 24px; }
    .state-card h3 { font-size: 19px; margin: 0; }
    .state-card p { color: var(--text-soft); margin: 7px 0 17px; }
    .skeleton { overflow: hidden; position: relative; background: #eeece5; border-radius: 10px; }
    .skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent); animation: shimmer 1.3s infinite; }
    @keyframes shimmer { to { transform: translateX(100%); } }
    .skeleton-line { height: 12px; margin-top: 9px; }
    .skeleton-card { height: 84px; margin-bottom: 9px; }

    .dialog-backdrop { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; background: rgba(31, 34, 30, .44); backdrop-filter: blur(5px); }
    #dialogBackdrop { z-index: 120; }
    .dialog-backdrop[hidden] { display: none; }
    .dialog { width: min(460px, 100%); border-radius: 20px; background: #fff; box-shadow: var(--shadow); overflow: hidden; }
    .dialog-head { padding: 19px 20px 10px; }
    .dialog-head h2 { font-size: 18px; margin: 0; }
    .dialog-body { padding: 0 20px 18px; color: var(--text-soft); }
    .dialog-body p { margin: 4px 0 0; }
    .dialog-form { display: grid; gap: 11px; margin-top: 14px; }
    .dialog-form .form-field input, .dialog-form .form-field select { width: 100%; }
    .dialog-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 14px; }
    .dialog-option { border: 1px solid var(--line); border-radius: 11px; background: #fff; padding: 10px; text-align: left; cursor: pointer; }
    .dialog-option:hover { border-color: #9fb9a8; background: var(--green-soft); }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 13px 20px 18px; border-top: 1px solid var(--line); }
    .missed-callout { margin: 16px 20px 0; padding: 13px 15px; border: 1px solid #dbe5dd; border-radius: 14px; background: #f6faf7; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .missed-callout strong, .missed-callout p { margin: 0; }
    .missed-callout p { margin-top: 3px; color: var(--text-soft); font-size: 13px; }
    .local-analysis-launch { margin: 16px 20px 0; padding: 14px 15px; border: 1px solid #cfe0d4; border-radius: 15px; background: linear-gradient(135deg, #f3faf5, #fbfaf6); display: flex; align-items: center; justify-content: space-between; gap: 16px; }

    .local-analysis-launch h3 { font-size: 14px; }
    .local-analysis-launch p { margin-top: 4px; color: var(--text-soft); font-size: 12px; line-height: 1.55; }
    .local-analysis-launch.is-error { border-color: #ead1cb; background: #fff7f5; }
    .local-analysis-launch.is-disabled { border-color: var(--line); background: #f7f6f2; }
    .analysis-summary { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .analysis-summary span { padding: 3px 8px; border-radius: 999px; background: #edf4ef; color: var(--green-strong); font-size: 11px; }
    .analysis-boundary { margin-top: 14px; padding: 12px 14px; border: 1px solid #e2ded4; border-radius: 13px; background: #faf8f3; color: var(--text-soft); font-size: 12px; line-height: 1.6; }
    .record-list { display: grid; gap: 12px; }
    .record-card { border: 1px solid var(--line); border-radius: 15px; background: #fff; padding: 16px; }
    .record-head, .record-actions, .relation-head, .relation-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    .record-head p { margin-top: 4px; color: var(--text-soft); font-size: 13px; }
    .record-actions { justify-content: flex-start; flex-wrap: wrap; margin-top: 14px; }
    .snapshot-grid { display: grid; gap: 10px; margin-top: 12px; }
    .snapshot-row { display: grid; grid-template-columns: 90px 110px minmax(180px, 1fr) 110px; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
    .relation-panel { display: grid; gap: 12px; margin-top: 16px; }
    .relation-chip-row { display: flex; flex-wrap: wrap; gap: 7px; margin: 8px 0; }

    .relation-chip.is-ended { background: #f1f0ed; color: var(--text-soft); }
    .suggestion-card { border: 1px dashed #c9b995; background: #fffaf0; border-radius: 13px; padding: 13px; }
    .suggestion-card p { margin: 6px 0; color: var(--text-soft); }
    .relationship-dialog { width: min(580px, 100%); }
    .person-flow-dialog { width: min(720px, 100%); max-height: min(86vh, 760px); display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .person-flow-dialog .dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
    .person-flow-dialog .dialog-head p { margin: 5px 0 0; color: var(--text-soft); }
    .person-flow-dialog .dialog-body { max-height: none; overflow: auto; padding-top: 18px; }
    .person-flow-dialog .detail-section { padding: 0; }
    .person-flow-dialog .detail-section + .detail-section { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
    .person-flow-sides { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; margin: 14px 0; }
    .person-flow-side { border: 1px solid var(--line); border-radius: 14px; background: #faf9f5; padding: 14px; }
    .person-flow-side strong { display: block; margin-bottom: 8px; }
    .person-flow-bridge { align-self: center; color: var(--text-soft); font-size: 12px; text-align: center; }
    .source-badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .source-badge { display: inline-flex; align-items: center; min-height: 24px; border: 1px solid #d5e3d9; border-radius: 999px; padding: 3px 8px; background: #f0f6f2; color: var(--green-strong); font-size: 11px; }
    .source-badge.is-suiyin { border-color: #d9dfeb; background: #f0f3f8; color: var(--blue); }
    .person-flow-status { border-radius: 12px; padding: 11px 13px; background: var(--green-soft); color: var(--green-strong); margin: 12px 0; }
    .person-flow-status.is-error { background: var(--amber-soft); color: var(--amber); }
    body.person-flow-open .standard-page { overflow: hidden; }
    .relationship-options { display: flex; flex-wrap: wrap; gap: 8px; max-height: 120px; overflow: auto; padding: 3px; }
    .relationship-options label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; }
    .dialog-help { font-size: 13px; color: var(--text-soft); }

    .history-fixtures, .history-compact, .dictionary-actions { display: flex; align-items: center; justify-content: flex-end; gap: 7px; flex-wrap: wrap; }

    .history-picker > summary::-webkit-details-marker { display: none; }
    .history-months { position: absolute; z-index: 20; right: 0; top: calc(100% + 8px); width: min(410px, 78vw); max-height: min(440px, 65vh); overflow: auto; padding: 15px; border: 1px solid var(--line); border-radius: 15px; background: #fff; box-shadow: var(--shadow); }
    .history-month + .history-month { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }

    .dictionary-row:first-child { border-top: 0; padding-top: 0; }
    .dictionary-label { min-width: 0; overflow-wrap: anywhere; }
    .relationship-dialog .dialog-body { max-height: min(65vh, 620px); overflow: auto; }

    .toast-region { position: fixed; right: 22px; bottom: 22px; z-index: 130; display: grid; gap: 8px; pointer-events: none; }
    .toast { max-width: 420px; border: 1px solid #c8d8ce; border-radius: 13px; background: #f6fbf7; color: var(--green-strong); padding: 11px 13px; box-shadow: var(--shadow); animation: toastIn .18s ease-out; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(7px); } }

    .offline-banner { display: flex; gap: 10px; align-items: center; border-radius: 12px; padding: 10px 12px; color: var(--amber); background: var(--amber-soft); margin-bottom: 12px; }
    .overflow-demo .candidate-reason { display: block; max-height: 40px; overflow: auto; -webkit-line-clamp: unset; }
    .muted { color: var(--text-faint); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @media (max-width: 1260px) {
      :root { --sidebar: 190px; --queue: 350px; }
      .detail-inner { padding-left: 26px; padding-right: 26px; }
      .reason-grid, .boundary-grid { grid-template-columns: 1fr; }
      .metric-row { grid-template-columns: repeat(2, 1fr); }
      .history-tools { min-width: 0; justify-items: start; }
      .history-fixtures, .history-compact, .dictionary-actions { justify-content: flex-start; }
      .moments-layout { grid-template-columns: 1fr; }
    }
  </style>

<body>
  <div class="app-shell">
    <nav class="sidebar" aria-label="关系维护主导航">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">今</div>
        <h1>关系·今天</h1>
        <p>只替你照看，不替你表演</p>
      </div>

      <div class="nav-label">每天</div>
      <div class="nav-stack">
        <button class="nav-button is-active" type="button" data-page="today" aria-current="page">
          <span class="nav-icon" aria-hidden="true">◉</span><span class="nav-text">今天</span><span class="nav-count" id="todayNavCount">0</span>
        </button>
        <button class="nav-button" type="button" data-page="missed">
          <span class="nav-icon" aria-hidden="true">↶</span><span class="nav-text">待补</span><span class="nav-count" id="missedNavCount">0</span>
        </button>
        <button class="nav-button" type="button" data-page="history">
          <span class="nav-icon" aria-hidden="true">日</span><span class="nav-text">每日历史</span>
        </button>
      </div>

      <div class="nav-label" style="margin-top:18px">关系库</div>

        </button>
        <button class="nav-button" type="button" data-page="identities">
          <span class="nav-icon" aria-hidden="true">≋</span><span class="nav-text">跨来源核对</span><span class="nav-count" id="identityNavCount">0</span>
        </button>
        <button class="nav-button" type="button" data-page="cold-storage">
          <span class="nav-icon" aria-hidden="true">◇</span><span class="nav-text">冷藏复盘</span><span class="nav-count" id="coldNavCount">0</span>
        </button>
        <button class="nav-button" type="button" data-page="sources">

    <section class="workspace">
      <header class="topbar">
        <div class="privacy-strip">
          <span class="privacy-dot" aria-hidden="true"></span>
          <div class="privacy-copy">
            <strong id="localRuntimeTitle">正在检查本机加密库</strong>
            <span id="localRuntimeStatus">正在确认本机真实关系图；没有自动发送。</span>
          </div>
        </div>
        <div class="top-actions">
          <span class="date-copy" id="currentLocalDate">正在读取本机日期</span>
        </div>
      </header>

      <main class="page-host" id="pageHost" tabindex="-1"></main>
      <aside class="sr-only" aria-label="说明">业务内容只来自本机真实关系图；没有数据时显示诚实空态。</aside>
    </section>
  </div>

  <div class="dialog-backdrop" id="dialogBackdrop" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogDescription">

    </section>
  </div>

  <div class="dialog-backdrop" id="personFlowBackdrop" hidden>

      <div class="dialog-body" id="personFlowDescription"></div>
    </section>
  </div>

      async function cancelSuiyinImport({ renderAfter = true } = {}) {

      async function confirmSuiyinImport() {
        if (suiyinImportInProgress || suiyinImportState.status !== "preview" || !suiyinImportState.staging || localVaultStatus.state !== "ready") return;
        suiyinImportInProgress = true;
        const previous = suiyinImportState;
        const scope = buildSuiyinScopeViewModel(previous.aggregate);

        suiyinImportState = { status: "ready", staging: null, aggregate: previous.aggregate, repairPreview: previous.repairPreview, error: null };
        suiyinImportInProgress = false;
        const refreshResult = await refreshAfterCommittedBusiness(previousGraph, graph, "suiyin-merge-affected");
        try { await fetch("/api/suiyin/import/cancel", { method: "POST", headers: { "Content-Type": "application/json; charset=utf-8" }, body: "{}" }); } catch {}
        if (refreshResult.ok) {

            : partial
              ? "已更新当前分配（不是三账号全量）；只增补本次已读对象，范围外人物和关系保持不变。"
              : "三账号完整范围已写入；好友人物、群上下文与可读消息条数分别记录，系统没有发送消息。");

      async function commitLocalMutation(mutator, success) {
        if (!localVaultStatus.graph || localVaultStatus.state !== "ready") return;
        const previousGraph = localVaultStatus.graph;
        const next = mutator(previousGraph);
        let generationId;
        try { generationId = await commitGraph(localVaultStatus.adapter, next, localVaultStatus.key); }
        catch { showToast("操作失败；原来的加密本地库没有改变。"); return; }
        localVaultStatus = { ...localVaultStatus, graph: next, activeGenerationId: generationId };
        resetLocalAnalysis({ preserveSemantic: true });
        const refreshResult = await refreshAfterCommittedBusiness(previousGraph, next, "graph-lifecycle-affected");
        if (refreshResult.ok) showToast(success);
      }

      const relationshipDecisionId = (kind) => `real-relationship-${kind}-${Date.now()}-${crypto.getRandomValues(new Uint32Array(1))[0]}`;
      async function runRealRelationshipEvaluation(personId) {
        if (realRelationshipState.saving || localVaultStatus.state !== "ready" || !localVaultStatus.graph) return;
        realRelationshipState = { personId, status: "loading", candidates: [], error: null, saving: false };
        renderPeople();
        await new Promise(resolve => window.setTimeout(resolve, 0));
        try {
          const result = evaluateRelationshipLabelCandidates(localVaultStatus.graph, { personId, now: new Date().toISOString() });
          realRelationshipState = { personId, status: result.status === "ready" ? "ready" : "empty", candidates: result.candidates || [], error: result.code, saving: false };
        } catch {
          realRelationshipState = { personId, status: "error", candidates: [], error: "RELATIONSHIP_CANDIDATE_INVALID", saving: false };
        }
        renderPeople();
      }

      function refreshLocalRelationshipAnalysis() {
        if (localVaultStatus.state !== "ready" || !localVaultStatus.graph) return;
        try {
          const result = analyzeLocalRelationshipGraph(localVaultStatus.graph, { now: new Date().toISOString() });
          localAnalysisState = { status: result.aggregate.candidateCount ? "ready" : "empty", result, error: null };
          const candidates = [...result.key, ...result.light];
          state.analysisSelectedId = candidates.some(candidate => candidate.personId === state.analysisSelectedId)
            ? state.analysisSelectedId
            : result.key[0]?.personId || result.light[0]?.personId || null;
        } catch {
          localAnalysisState = { status: "error", result: null, error: "analysis-failed" };
          state.analysisSelectedId = null;
        }
      }

      function currentLocalSemanticEntry(personId) {
        return localSemanticCoverageGenerationId && localSemanticCoverageGenerationId === localVaultStatus.activeGenerationId ? localSemanticState.get(personId) : null;
      }

      function countLocalSemanticEntries(entries) {
        const counts = { ready: 0, generic: 0, empty: 0, reimportRequired: 0, unconfirmed: 0, error: 0 };
        for (const entry of entries.values()) {
          const key = entry.status === "reimport-required" ? "reimportRequired" : entry.status;
          if (Object.hasOwn(counts, key)) counts[key] += 1;
          else counts.error += 1;
        }
        return counts;
      }

      function scheduleLocalSemanticRefresh(previousGraph, nextGraph, reason, { previousGenerationId = localSemanticCoverageGenerationId, businessCommitted = true, staleRetry = 0 } = {}) {
        const affected = computeLocalSemanticAffectedPeople(previousGraph, nextGraph);
        const previousActiveIds = activeLocalSemanticPersonIds(previousGraph);
        const completeStableBase = localSemanticCoverageGraph === previousGraph
          && localSemanticCoverageGenerationId === previousGenerationId
          && localSemanticCachePayload
          && localSemanticCoveragePersonIds.size === previousActiveIds.length
          && previousActiveIds.every(personId => localSemanticCoveragePersonIds.has(personId) && localSemanticState.has(personId));
        return runLocalSemanticBatch(reason, affected.mode === "affected" && completeStableBase ? { mode: "affected", personIds: affected.personIds, businessCommitted, staleRetry } : { mode: "full", businessCommitted, staleRetry });
      }

      async function refreshAfterCommittedBusiness(previousGraph, nextGraph, reason, { failureCopy = "数据已保存；分析缓存未更新，可重试", showFailure = true } = {}) {
        try {
          const result = await scheduleLocalSemanticRefresh(previousGraph, nextGraph, reason, { businessCommitted: true });
          if (result?.ok || result?.code === "BATCH_STALE_DISCARDED") return result;
          if (showFailure) showToast(failureCopy);
          return { ok: false, code: result?.code || "ANALYSIS_CACHE_WRITE_FAILED" };
        } catch (error) {
          const fallbackToken = ++localSemanticBatchToken;
          localSemanticProgressPainter.fallback(fallbackToken);
          if (showFailure) showToast(failureCopy);
          return { ok: false, code: error?.code || "ANALYSIS_CACHE_WRITE_FAILED" };
        }
      }

      async function runLocalSemanticBatch(reason, { mode = "full", personIds = null, businessCommitted = false, staleRetry = 0 } = {}) {
        const capturedToken = ++localSemanticBatchToken;
        if (localVaultStatus.state !== "ready" || !localVaultStatus.graph) {
          localSemanticProgressPainter.fallback(capturedToken);
          return { ok: false, code: "BATCH_SNAPSHOT_INVALID" };
        }
        const activeGraph = localVaultStatus.graph;
        const activeGenerationId = localVaultStatus.activeGenerationId;
        if (!activeGenerationId) {
          localSemanticProgressPainter.fallback(capturedToken);
          return { ok: false, code: "BATCH_SNAPSHOT_INVALID" };
        }
        localSemanticProgressPainter.progress(capturedToken);
        const affectedPersonIds = mode === "affected" ? [...new Set(personIds || [])] : [];
        clearLocalSemanticOverlays(mode === "full" ? null : affectedPersonIds);
        let snapshot;
        try {
          snapshot = createLocalSemanticBatchSnapshot(activeGraph, { personIds: mode === "affected" ? affectedPersonIds : null, now: new Date().toISOString() });
        } catch {
          if (capturedToken !== localSemanticBatchToken || localVaultStatus.activeGenerationId !== activeGenerationId) {
            localSemanticProgressPainter.discard(capturedToken);
            return { ok: false, code: "BATCH_STALE_DISCARDED" };
          }
          localSemanticBatchState = { status: "error", scope: mode, reason, processed: 0, total: 0, coverageProcessed: 0, coverageTotal: 0, ready: 0, generic: 0, empty: 0, reimportRequired: 0, unconfirmed: 0, error: 1, completedAtLabel: "", algorithmVersion: "local-semantic-v2", cacheStatus: "save-failed", businessCommitted };
          localSemanticProgressPainter.terminal(capturedToken);
          return { ok: false, code: "BATCH_ANALYSIS_FAILED" };
        }
        const activePersonIds = activeLocalSemanticPersonIds(activeGraph);
        const counts = { ready: 0, generic: 0, empty: 0, reimportRequired: 0, unconfirmed: 0, error: 0 };
        const baseCoverage = localSemanticCoverageGenerationId === activeGenerationId ? activePersonIds.filter(personId => localSemanticState.has(personId)).length : 0;
        localSemanticBatchState = { status: "running", scope: mode, reason, processed: 0, total: snapshot.total, coverageProcessed: baseCoverage, coverageTotal: activePersonIds.length, ...counts, completedAtLabel: "", algorithmVersion: snapshot.algorithmVersion, cacheStatus: "saving", businessCommitted };
        localSemanticProgressPainter.progress(capturedToken);
        const analyzedResults = new Map();
        const runEntries = new Map();
        for (let start = 0; start < snapshot.personIds.length; start += 20) {
          const chunk = snapshot.personIds.slice(start, start + 20);
          for (const personId of chunk) {
            if (capturedToken !== localSemanticBatchToken || localVaultStatus.activeGenerationId !== activeGenerationId) {
              localSemanticProgressPainter.discard(capturedToken);
              return { ok: false, code: "BATCH_STALE_DISCARDED" };
            }
            try {
              const analyzed = snapshot.analyzeForCache(personId);
              const result = analyzed.result;
              const countKey = result.state === "reimport-required" ? "reimportRequired" : result.state;
              if (Object.hasOwn(counts, countKey)) counts[countKey] += 1;
              else counts.error += 1;
              analyzedResults.set(personId, analyzed);
              runEntries.set(personId, immutableLocalSemanticEntry(result, analyzed.inputRevision));
            } catch {
              counts.error += 1;
              runEntries.set(personId, Object.freeze({ status: "error", result: null, error: "BATCH_ANALYSIS_FAILED", inputRevision: null }));
            }
          }
          if (capturedToken !== localSemanticBatchToken || localVaultStatus.activeGenerationId !== activeGenerationId) {
            localSemanticProgressPainter.discard(capturedToken);
            return { ok: false, code: "BATCH_STALE_DISCARDED" };
          }
          localSemanticBatchState = { status: "running", scope: mode, reason, processed: runEntries.size, total: snapshot.total, coverageProcessed: Math.min(activePersonIds.length, baseCoverage + runEntries.size), coverageTotal: activePersonIds.length, ...counts, completedAtLabel: "", algorithmVersion: snapshot.algorithmVersion, cacheStatus: "saving", businessCommitted };
          localSemanticProgressPainter.progress(capturedToken);
          if (start + 20 < snapshot.personIds.length) await new Promise(resolve => window.setTimeout(resolve, 0));
        }
        if (capturedToken !== localSemanticBatchToken || localVaultStatus.activeGenerationId !== activeGenerationId) {
          localSemanticProgressPainter.discard(capturedToken);
          return { ok: false, code: "BATCH_STALE_DISCARDED" };
        }
        const activeSet = new Set(activePersonIds);
        const installed = mode === "full" ? new Map() : new Map([...localSemanticState].filter(([personId]) => activeSet.has(personId) && !affectedPersonIds.includes(personId)));
        for (const [personId, entry] of runEntries) installed.set(personId, entry);
        const installedState = readonlyLocalSemanticMap(installed);
        const installedCounts = countLocalSemanticEntries(installedState);
        const terminalState = {
          status: counts.error ? "partial" : "ready",
          scope: mode,
          reason,
          processed: runEntries.size,
          total: snapshot.total,
          coverageProcessed: activePersonIds.filter(personId => installed.has(personId)).length,
          coverageTotal: activePersonIds.length,
          ...installedCounts,
          completedAtLabel: new Intl.DateTimeFormat("zh-CN", { hour: "2-digit", minute: "2-digit" }).format(new Date()),
          algorithmVersion: snapshot.algorithmVersion,
          cacheStatus: "saving",
          businessCommitted,
        };
        const installComputedBase = (cacheStatus, nextPayload, { terminal = true } = {}) => {
          localSemanticState = installedState;
          localSemanticCoverageGraph = activeGraph;
          localSemanticCoverageGenerationId = activeGenerationId;
          localSemanticCoveragePersonIds = new Set(activePersonIds);
          localSemanticCachePayload = nextPayload;
          localSemanticBatchState = { ...terminalState, cacheStatus };
          refreshLocalRelationshipAnalysis();
          if (terminal) localSemanticProgressPainter.terminal(capturedToken);
          else localSemanticProgressPainter.progress(capturedToken);
        };
        const previousCachePayload = localSemanticCachePayload;
        let payload = null;
        try {
          if (counts.error) throw Object.assign(new Error("analysis-incomplete"), { code: "ANALYSIS_CACHE_WRITE_FAILED" });
          payload = buildLocalSemanticCachePayload(activeGraph, analyzedResults, { previousPayload: mode === "affected" ? previousCachePayload : null, mode, affectedPersonIds });
          const cacheResult = await commitLocalSemanticCache(localVaultStatus.adapter, localVaultStatus.key, { expectedActiveGenerationId: activeGenerationId, payload });
          if (capturedToken !== localSemanticBatchToken || localVaultStatus.activeGenerationId !== activeGenerationId) {
            localSemanticProgressPainter.discard(capturedToken);
            return { ok: false, code: "BATCH_STALE_DISCARDED" };
          }
          installComputedBase("saved", payload);
          return { ok: true, processed: runEntries.size, total: snapshot.total, cacheWriteCount: cacheResult.cacheWriteCount };
        } catch (error) {
          if (capturedToken !== localSemanticBatchToken || localVaultStatus.activeGenerationId !== activeGenerationId) {
            localSemanticProgressPainter.discard(capturedToken);
            return { ok: false, code: "BATCH_STALE_DISCARDED" };
          }
          if (error?.code === "ANALYSIS_CACHE_STALE") {
            let latest;
            try { latest = await loadActiveGraphWithSemanticCache(localVaultStatus.adapter, localVaultStatus.key); }
            catch { latest = null; }
            if (!latest) {
              localSemanticBatchState = { ...terminalState, status: "error", cacheStatus: "save-failed" };
              localSemanticProgressPainter.terminal(capturedToken);
              return { ok: false, code: "ANALYSIS_CACHE_STALE" };
            }
            localVaultStatus = { ...localVaultStatus, graph: latest.graph, activeGenerationId: latest.activeGenerationId };
            if (latest.semanticCache?.status === "hit") {
              installLocalSemanticCacheHit(latest);
              refreshLocalRelationshipAnalysis();
              localSemanticProgressPainter.terminal(capturedToken);
              return { ok: true, processed: 0, total: 0, cacheWriteCount: 0 };
            }
            if (staleRetry >= 1) {
              localSemanticBatchState = { ...terminalState, status: "error", cacheStatus: "save-failed" };
              localSemanticProgressPainter.terminal(capturedToken);
              return { ok: false, code: "ANALYSIS_CACHE_STALE" };
            }
            installComputedBase("saving", payload, { terminal: false });
            return scheduleLocalSemanticRefresh(activeGraph, latest.graph, "business-affected", { previousGenerationId: activeGenerationId, businessCommitted, staleRetry: staleRetry + 1 });
          }
          installComputedBase("save-failed", payload);
          return { ok: false, code: error?.code === "ANALYSIS_CACHE_WRITE_FAILED" ? error.code : "ANALYSIS_CACHE_WRITE_FAILED", processed: runEntries.size, total: snapshot.total };
        }
      }

      async function runLocalSemanticAnalysis(personId) {
        if (localVaultStatus.state !== "ready" || !localVaultStatus.graph || !activeLocalSemanticPersonIds(localVaultStatus.graph).includes(personId)) return { ok: false, code: "BATCH_SNAPSHOT_INVALID" };
        const activeIds = activeLocalSemanticPersonIds(localVaultStatus.graph);
        const completeBase = localSemanticCoverageGenerationId === localVaultStatus.activeGenerationId && localSemanticCachePayload && localSemanticCoveragePersonIds.size === activeIds.length && activeIds.every(id => localSemanticState.has(id));
        return runLocalSemanticBatch("person-refresh-affected", completeBase ? { mode: "affected", personIds: [personId] } : { mode: "full" });
      }

      async function applyRealRelationshipMutation(input, successCopy, renderAfter = renderPeople) {
        if (realRelationshipState.saving || localVaultStatus.state !== "ready" || !localVaultStatus.graph) return { ok: false, code: "RELATIONSHIP_WRITE_FAILED" };
        const activeGraph = localVaultStatus.graph;
        let mutation;
        const directSingle = personFlowState.open && personFlowState.phase === "relationship" && personFlowState.personId === input.personId && personFlowState.single?.mappingId
          ? personFlowState.single
          : null;
        try {
          mutation = directSingle && ["add", "accept", "edit-accept"].includes(input.operation)
            ? mutateSingleSourceRelationship(activeGraph, {
                personId: input.personId,
                mappingId: directSingle.mappingId,
                intent: input.operation === "add" ? "manual-add" : "semantic-accept",
                label: input.operation === "accept" ? input.candidate?.label : input.label,
                decisionId: input.decisionId,
                at: input.at,
                expectedActiveGenerationId: personFlowState.expectedActiveGenerationId,
                currentActiveGenerationId: localVaultStatus.activeGenerationId,
                semanticResult: input.semanticResult
              })
            : mutateRelationshipFacts(activeGraph, input);
        }
        catch (error) {
          realRelationshipState = { ...realRelationshipState, status: "error", error: error?.code || "RELATIONSHIP_WRITE_FAILED", saving: false };

          return { ok: false, code: realRelationshipState.error };

        if (!mutation.changed) {

        }

        renderAfter();
        let generationId;
        try {
          generationId = await commitGraph(localVaultStatus.adapter, mutation.graph, localVaultStatus.key);
        } catch {
          realRelationshipState = { ...realRelationshipState, status: "error", error: "RELATIONSHIP_WRITE_FAILED", saving: false };
          renderAfter();
          showToast("保存失败；原关系未改变。可以重试。");

        if (mutation.formalIdentityWriteCount === 1 && personFlowState.open) {

        }
        if (typeof resetLocalAnalysis === "function") resetLocalAnalysis({ preserveSemantic: true });
        else { analysisInProgress = false; localAnalysisState = { status: "idle", result: null, error: null }; state.analysisSelectedId = null; }
        realRelationshipState = { personId: input.personId, status: "idle", candidates: [], error: null, saving: false };
        const refreshResult = typeof refreshAfterCommittedBusiness === "function"
          ? await refreshAfterCommittedBusiness(activeGraph, mutation.graph, "graph-lifecycle-affected")
          : { ok: false, code: "ANALYSIS_CACHE_WRITE_FAILED" };
        if (refreshResult.ok) showToast(successCopy);
        return { ok: true, changed: true, formalWriteCount: 1, relationshipId: mutation.relationshipId, analysisCacheUpdated: refreshResult.ok };
      }

      const backupPhrase = () => document.getElementById("localBackupPhrase")?.value || "";

          const phrase = backupPhrase();
          localBackupArtifact = null;
          clearPendingRestore();
          localRestorePreview = null;

          if (!localVaultStatus.graph || phrase.length < 8) { showToast("请输入至少 8 位的独立恢复口令。"); return { code: "backup-phrase-invalid" }; }

          if (!target) throw new Error("backup-sink-unavailable");

          const sink = { write: (value) => writable.write(value), close: () => writable.close(), abort: () => writable.abort?.(), readText: async () => (await target.getFile()).text() };
          const verified = await writeVerifiedBackup(localVaultStatus.graph, phrase, sink);

        return getLocalProjectionViewModel(localVaultStatus)?.rowByPerson.get(personId)?.sourceBadges || fallback;
      }

      function currentMappingAccountAttribution(actionToken, vaultStatus = localVaultStatus) {
        const action = accountAttributionActionTokens.get(actionToken) || peopleActionTokens.get(actionToken);
        const viewModel = getLocalProjectionViewModel(vaultStatus);
        const slot = viewModel?.accountAttributionByPerson.get(action?.personId);
        if (!action || !slot || action.expectedActiveGenerationId !== vaultStatus.activeGenerationId) {
          const error = new Error("ACCOUNT_ATTRIBUTION_STALE");
          error.code = "ACCOUNT_ATTRIBUTION_STALE";
          throw error;
        }
        const projection = projectMappingAccountAttribution(vaultStatus.graph, { mappingId: slot.mappingId });
        return { actionToken, personId: action.personId, mappingId: slot.mappingId, expectedActiveGenerationId: action.expectedActiveGenerationId, projection };
      }

      function renderAccountAttributionAction(personId, surface = "people", existingActionToken = null) {
        const viewModel = getLocalProjectionViewModel(localVaultStatus);
        if (!viewModel?.accountAttributionByPerson.has(personId)) return "";
        const actionToken = existingActionToken || createViewActionToken(accountAttributionActionTokens, { personId, expectedActiveGenerationId: localVaultStatus.activeGenerationId }, `account-attribution-${surface}`);
        const pending = (viewModel.rowByPerson.get(personId)?.sourceBadges || []).some(badge => badge?.kind === "wechat" && badge?.label === "微信导出 · 归属待核对");
        return `<button class="btn btn-small" type="button" data-action="account-attribution-open" data-action-token="${actionToken}">${pending ? "核对来源归属" : "修改来源归属"}</button>`;
      }

      function renderAccountAttributionReviewStatus(viewModel = getLocalProjectionViewModel(localVaultStatus)) {
        const pendingCount = (viewModel?.rows || []).filter(row => viewModel.accountAttributionByPerson.has(row.personId) && (row.sourceBadges || []).some(badge => badge?.kind === "wechat" && badge?.label === "微信导出 · 归属待核对")).length;
        return pendingCount > 0
          ? `<section class="local-analysis-launch" role="status"><div><h3>微信导出 · 归属待核对 ${pendingCount} 人</h3><p>请逐人核对；每次仅修改 1 人，不会把同一来源的其他人物一起改掉。</p></div></section>`
          : "";
      }

      function openMappingAccountAttributionDialog(actionToken) {
        let current;
        try { current = currentMappingAccountAttribution(actionToken); }
        catch {
          showToast("来源归属已变化；请重新打开。原归属未改变。");
          return;
        }
        const options = Array.isArray(current.projection?.options) ? current.projection.options.filter(option => Number.isInteger(option?.optionIndex) && option.optionIndex >= 0 && typeof option.label === "string") : [];
        const optionRows = options.map(option => {
          const label = option.optionIndex === 0 ? "私人微信" : `碎银 · ${option.label}`;
          const selected = current.projection.state === "private-wechat" ? option.optionIndex === 0 : ["exact-suiyin-persona", "suiyin-persona"].includes(current.projection.state) && current.projection.currentLabel === label;
          return `<label class="relation-row"><span><input type="radio" name="accountAttributionOption" data-option-index="${option.optionIndex}" ${selected ? "checked" : ""}> ${escapeHtml(label)}</span></label>`;
        }).join("");
        const returnScrollTop = pageHost.querySelector(".standard-page")?.scrollTop || 0;
        accountAttributionEditorState = { open: true, actionToken, personId: current.personId, returnScrollTop };
        openDialog({
          title: "核对来源归属",
          body: `<p><strong>当前账号归属：${escapeHtml(current.projection.currentLabel || "微信导出 · 归属待核对")}</strong></p><p>仅修改当前人物（1人）；不会批量修改同一导出来源中的其他人物。</p><div class="dialog-form" role="radiogroup" aria-label="选择账号归属">${optionRows || '<p class="muted">当前没有安全可用的归属选项。</p>'}</div>${current.projection.canUndo ? `<div class="record-actions"><button class="btn btn-danger-soft" type="button" data-action="account-attribution-undo" data-action-token="${actionToken}">撤销我的归属决定</button></div>` : ""}<p class="dialog-help">只显示私人微信与当前加密库中的碎银官方人设；取消、失败或资料变化都不会写入。若提示过期，请重新打开；原归属未改变。</p>`,
          confirm: "保存来源归属",
          action: async () => { await commitMappingAccountAttribution(actionToken, "set"); }
        });
        window.setTimeout(() => dialogDescription.querySelector('input[name="accountAttributionOption"]:checked, input[name="accountAttributionOption"]')?.focus(), 0);
      }

      async function commitMappingAccountAttribution(actionToken, operation = "set") {
        if (accountAttributionSaving || localVaultStatus.state !== "ready" || !localVaultStatus.graph) return;
        let current;
        try { current = currentMappingAccountAttribution(actionToken); }
        catch {
          showToast("本地关系库已变化；请重新打开来源归属核对。原归属未改变。");
          return;
        }
        const selected = operation === "set" ? dialogDescription.querySelector('input[name="accountAttributionOption"]:checked') : null;
        const optionIndex = selected ? Number(selected.dataset.optionIndex) : null;
        if (operation === "set" && !Number.isInteger(optionIndex)) {
          showToast("请先选择私人微信或一个碎银官方人设；原归属未改变。");
          return;
        }
        const at = new Date().toISOString();
        const mutationInput = {
          mappingId: current.mappingId,
          operation,
          decisionId: `account-attribution-${viewActionSession}-${++viewActionSequence}`,
          at,
          expectedActiveGenerationId: current.expectedActiveGenerationId,
          currentActiveGenerationId: localVaultStatus.activeGenerationId
        };
        if (operation === "set") {
          mutationInput.selectionKind = optionIndex === 0 ? "private-wechat" : "suiyin-persona";
          if (optionIndex > 0) mutationInput.optionIndex = optionIndex;
        }
        const priorEditor = { ...accountAttributionEditorState };
        accountAttributionSaving = true;
        dialogConfirm.disabled = true;
        dialogCancel.disabled = true;
        dialogConfirm.setAttribute("aria-busy", "true");
        dialogConfirm.textContent = operation === "undo" ? "正在撤销…" : "正在加密保存…";
        try {
          const mutation = mutateMappingAccountAttribution(localVaultStatus.graph, mutationInput);
          if (!mutation.changed) {
            closeDialog();
            showToast("来源归属已经是当前选择；本地关系库未写入。");
            return;
          }
          const generationId = await commitGraph(localVaultStatus.adapter, mutation.graph, localVaultStatus.key, {
            now: at,
            preserveSemanticCache: true,
            expectedActiveGenerationId: current.expectedActiveGenerationId
          });
          localVaultStatus = { ...localVaultStatus, graph: mutation.graph, activeGenerationId: generationId };
          closeDialog();
          render();
          window.requestAnimationFrame(() => {
            const scroller = pageHost.querySelector(".standard-page");
            if (scroller) scroller.scrollTop = priorEditor.returnScrollTop;
            if (state.page === "people") refreshPeopleWindow({ force: true });
            const nextToken = [...accountAttributionActionTokens, ...peopleActionTokens].find(([, action]) => action?.personId === priorEditor.personId)?.[0];
            const nextControl = nextToken ? document.querySelector(`[data-action="account-attribution-open"][data-action-token="${nextToken}"]`) : null;
            (nextControl || document.getElementById("peopleSearch") || pageHost).focus({ preventScroll: true });
          });
          showToast("来源归属已加密保存；重开无需重读");
        } catch (error) {
          const stale = error?.code === "ACCOUNT_ATTRIBUTION_STALE" || error?.code === "BUSINESS_GENERATION_STALE";
          showToast(stale ? "本地关系库已变化；请重新打开。原归属未改变。" : "保存失败；原归属未改变。请重新打开后重试。");
        } finally {
          accountAttributionSaving = false;
          dialogConfirm.removeAttribute("aria-busy");
          if (!dialogBackdrop.hidden) {
            dialogConfirm.disabled = false;
            dialogCancel.disabled = false;
            dialogConfirm.textContent = operation === "undo" ? "确认撤销" : "保存来源归属";
          }
        }
      }

      function resolveCurrentReviewGroup(reviewGroupId, vaultStatus = localVaultStatus) {
        if (!reviewGroupId) return null;
        return getLocalProjectionViewModel(vaultStatus)?.identityReview?.pairs?.find(item => item.pairKey === reviewGroupId) || null;
      }

      function buildRealRuntimeModel(vaultStatus, projectPeople = projectRelationshipLibrary, projectIdentities = projectCrossSourceReview, projectionViewModel = null) {
        const status = vaultStatus?.state;
        const ready = status === "ready";
        const graph = ready && vaultStatus.graph && typeof vaultStatus.graph === "object" ? vaultStatus.graph : null;
        const fields = ["sources", "people", "excerpts", "mappings", "relationships", "signals", "actions"];
        const hasBusinessData = Boolean(graph && fields.some(field => Array.isArray(graph[field]) && graph[field].length > 0));
        const peopleProjection = graph ? projectionViewModel?.relationshipLibrary || projectPeople(graph) : null;
        const identityReview = graph ? projectionViewModel?.crossSourceReview || projectIdentities(graph) : { pendingCount: null };
        return Object.freeze({
          phase: ready ? (hasBusinessData ? "ready-nonempty" : "ready-empty") : status === "checking" ? "checking" : "unavailable",
          graph,
          hasBusinessData,
          peopleProjection,
          counts: Object.freeze({
            people: graph ? Number(peopleProjection?.aggregate?.peopleCount || 0) : null,
            identities: graph ? Number(identityReview.pendingCount || 0) : null,
            missed: graph ? 0 : null,
            cold: graph ? 0 : null
          })
        });
      }

      function formatRuntimeCount(value) {
        return Number.isInteger(value) && value >= 0 ? String(value) : "—";
      }

      function buildSourceControlState(vaultStatus = localVaultStatus, preview = localImportPreview, { suiyinBusy = suiyinImportInProgress, suiyinStatus = suiyinImportState.status, wechatSaving = false } = {}) {
        const ready = vaultStatus?.state === "ready";
        const previewReady = Boolean(preview?.ok && preview?.state === "preview-ready" && preview?.diff);
        const previewCurrent = ready && preview?.expectedActiveGenerationId === vaultStatus.activeGenerationId;
        const conflictCount = Array.isArray(preview?.diff?.conflicts) ? preview.diff.conflicts.length : 0;
        const wechatConfirmDisabledReason = !ready
          ? "库未就绪"
          : !previewReady || !previewCurrent
            ? "预览失效待重算"
            : conflictCount > 0
              ? `有 ${conflictCount} 个真实冲突`
              : wechatSaving
                ? "正在保存"
                : "";
        return Object.freeze({
          wechatPickerEnabled: true,
          wechatConfirmEnabled: wechatConfirmDisabledReason === "",
          wechatConfirmDisabledReason,
          wechatConflictCopy: conflictCount > 0 ? `有 ${conflictCount} 条原始内容/来源冲突，处理后才能确认` : "",
          suiyinReadEnabled: Boolean(ready && !suiyinBusy && !["loading", "committing"].includes(suiyinStatus)),
          retryEnabled: vaultStatus?.state === "unavailable"
        });
      }

      function renderVaultTransitionRoute(route, vaultStatus = localVaultStatus, sink = pageHost, { preview = localImportPreview, suiyinBusy = suiyinImportInProgress, suiyinStatus = suiyinImportState.status, wechatSaving = false } = {}) {
        if (vaultStatus?.state === "ready" && vaultStatus.graph) return false;
        const unavailable = vaultStatus?.state === "unavailable";
        const labels = {
          today: ["Morning review", "今天"],
          missed: ["Missed", "待补"],
          history: ["Daily history", "每日历史"],
          people: ["Relationship library", "全部关系"],
          identities: ["Cross-source review", "跨来源核对"],
          "cold-storage": ["Review later", "冷藏复盘"],
          sources: ["Local privacy", "数据来源"]
        }[route] || ["Local relationship", "关系·今天"];
        const controls = buildSourceControlState(vaultStatus, preview, { suiyinBusy, suiyinStatus, wechatSaving });
        const previewCopy = preview?.receipt?.batchName
          ? `<p><strong>已选择：${escapeHtml(preview.receipt.batchName)} · 选择时间 ${escapeHtml(preview.receipt.selectedAt)}</strong></p><p>已保留这次只读解析；关系库恢复后会按真实已保存数据重新核对变更，不需要重新选择目录。</p>`
          : "";
        const sourceActions = route === "sources"
          ? `<div class="record-actions"><button class="btn btn-primary" type="button" data-action="choose-local-export" ${controls.wechatPickerEnabled ? "" : "disabled"}>选择微信导出</button><button class="btn" type="button" data-action="suiyin-import-preview" disabled>读取碎银当前分配</button></div>${previewCopy}`
          : "";
        const retry = controls.retryEnabled ? '<button class="btn btn-primary" type="button" data-action="local-vault-retry">重试本机加密库</button>' : "";
        const title = unavailable ? "暂时未能打开已保存的本机关系库" : "正在恢复已保存的本机关系库";
        const detail = unavailable ? "数据没有被删除。请重试打开；不会自动重新导入、读取碎银或改写关系库。" : "已保存数据正在恢复；未知数量显示 —，不会用 0 冒充空库。";
        sink.innerHTML = `<section class="standard-page" data-vault-state="${unavailable ? "unavailable" : "checking"}"><div class="page-frame"><header class="page-title-row"><div><span class="eyebrow">${labels[0]}</span><h2>${labels[1]}</h2><p>${detail}</p></div><span class="person-status">—</span></header><div class="state-card"><div class="state-card-inner"><div class="state-icon" aria-hidden="true">${unavailable ? "!" : "○"}</div><h3>${title}</h3><p>${detail}</p>${retry}${sourceActions}</div></div></div></section>`;
        return true;
      }

      function renderHonestEmptyRoute(route, sink = pageHost) {
        const content = {
          missed: ["Missed, when available", "待补", "真实待补记录尚未接入", "当前没有可显示的真实待补记录。未来接入真实模型前，这里不会模拟归档、移回或稍后处理。"],
          history: ["Daily history, when available", "每日历史", "暂无真实历史记录", "真实历史快照尚未接入。这里不会用固定日期或批次补造记录。"],
          "cold-storage": ["Review later, when available", "冷藏复盘", "暂无真实冷藏记录", "真实冷藏模型尚未接入。这里不会模拟到期、恢复或成功反馈。"]
        }[route];
        if (!content) return false;
        sink.innerHTML = `<section class="standard-page" data-runtime-source="empty"><div class="page-frame"><header class="page-title-row"><div><span class="eyebrow">${content[0]}</span><h2>${content[1]}</h2><p>这个入口会保留，但只显示已批准的真实状态。</p></div><span class="person-status">0</span></header><div class="state-card"><div class="state-card-inner"><div class="state-icon" aria-hidden="true">○</div><h3>${content[2]}</h3><p>${content[3]}</p></div></div></div></section>`;
        return true;
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>'"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));
      }

      function assignMomentIdentity(model, itemId, personId, options = {}) {
        const item = model.items.find(candidate => candidate.id === itemId);
        if (!item || !personId || options.cancelled || options.saveSucceeded === false) return { ok: false, error: "not-committed" };
        item.identityStatus = "confirmed";
        item.personId = personId;
        const signal = model.signals.find(candidate => candidate.itemId === itemId);
        if (signal) { signal.identityStatus = "confirmed"; signal.personId = personId; }
        return { ok: true, itemId, personId };
      }

      function classifyMomentSignal(model, signalId, classification, options = {}) {
        const allowed = ["topic-approved", "internal", "irrelevant", "sensitive"];
        const signal = model.signals.find(candidate => candidate.id === signalId);
        if (!signal || !allowed.includes(classification) || signal.identityStatus !== "confirmed" || signal.invalidated || options.cancelled || options.saveSucceeded === false) return { ok: false, error: "not-committed" };
        signal.classification = classification;
        return { ok: true, signalId, classification };
      }

      function buildMomentInsights(model, personId) {
        const valid = model.signals.filter(signal => signal.personId === personId && signal.identityStatus === "confirmed" && !signal.invalidated && !["irrelevant", "sensitive"].includes(signal.classification) && model.sources.some(source => source.id === signal.sourceId && !source.invalidated && source.status !== "deleted"));
        return valid.flatMap(signal => [
          { category: "最近变化", text: signal.kind === "third-party" ? "有第三方信息，仅作内部提醒。" : signal.summary, sourceId: signal.sourceId, publishedAt: signal.publishedAt },
          ...(signal.kind === "publisher" ? [{ category: "自然时机", text: "这条公开近况可能形成自然问候入口，仍需你判断。", sourceId: signal.sourceId, publishedAt: signal.publishedAt }, { category: "共同话题", text: "可以围绕公开内容简单问近况，不延伸未公开细节。", sourceId: signal.sourceId, publishedAt: signal.publishedAt }] : [])
        ]);
      }

      function visibleMomentSignals(model, personId = null) {
        return model.signals.filter(signal => (personId === null || signal.personId === personId) && signal.identityStatus === "confirmed" && !signal.invalidated && model.sources.some(source => source.id === signal.sourceId && !source.invalidated && source.status !== "deleted"));
      }

      function eligiblePreparedTopics(model, personId) {
        return model.signals.filter(signal => signal.personId === personId && signal.identityStatus === "confirmed" && signal.kind === "publisher" && signal.classification === "topic-approved" && !signal.invalidated && model.sources.some(source => source.id === signal.sourceId && !source.invalidated && source.status !== "deleted")).map(signal => ({ signalId: signal.id, sourceId: signal.sourceId, publishedAt: signal.publishedAt, publisher: signal.publisher, body: signal.body, summary: signal.summary, kind: signal.kind, mediaDescription: signal.mediaDescription }));
      }

      function buildContactPreparation(person, model) {
        return { drafts: { ...person.drafts }, topics: eligiblePreparedTopics(model, person.personId) };
      }

      function invalidateMomentSource(model, sourceId, mode, options = {}) {
        if (!model || !Array.isArray(model.sources) || !Array.isArray(model.signals) || !Array.isArray(model.preparedTopics) || !Array.isArray(model.actionHistory) || (mode === "delete" && !Array.isArray(model.items))) return { ok: false, error: "invalid-model" };
        const source = model.sources.find(candidate => candidate.id === sourceId);
        if (!source || !["revoke", "delete"].includes(mode) || options.cancelled || options.saveSucceeded === false) return { ok: false, error: "not-committed" };
        if ((mode === "delete" && source.status === "deleted") || (mode === "revoke" && source.invalidated)) return { ok: true, sourceId, mode };
        const nextSource = { ...source, invalidated: true, status: mode === "delete" ? "deleted" : source.status };
        const nextSignals = model.signals.map(signal => signal.sourceId !== sourceId ? signal : {
          ...signal,
          invalidated: true,
          classification: "invalidated",
          ...(mode === "delete" ? { publisher: "", body: "", mediaDescription: "", summary: "", personId: null } : {})
        });
        const nextItems = mode === "delete" ? model.items.map(item => item.sourceId !== sourceId ? item : { ...item, publisher: "", body: "", mediaDescription: "", personId: null, identityStatus: "deleted" }) : model.items;
        const nextTopics = model.preparedTopics.filter(topic => topic.sourceId !== sourceId);
        const nextHistory = model.actionHistory.map(action => action.sourceId !== sourceId ? action : (() => { const next = { ...action, sourceNote: mode === "delete" ? "当时使用过的朋友圈来源已删除；原文不再保留" : "当时使用过的朋友圈来源已撤销；原文不再保留" }; delete next.sourceOriginal; return next; })());
        model.sources.splice(0, model.sources.length, ...model.sources.map(candidate => candidate.id === sourceId ? nextSource : candidate));
        model.signals.splice(0, model.signals.length, ...nextSignals);
        if (mode === "delete") model.items.splice(0, model.items.length, ...nextItems);
        model.preparedTopics.splice(0, model.preparedTopics.length, ...nextTopics);
        model.actionHistory.splice(0, model.actionHistory.length, ...nextHistory);
        return { ok: true, sourceId, mode };
      }

      function renderMomentSource(source) {
        const status = source.status === "deleted" ? "来源已删除" : source.invalidated ? "来源已撤销" : "未读取真实朋友圈";
        return `<article class="source-card"><div class="source-head"><div><h3>${escapeHtml(source.label)}</h3><p>仅使用虚构演示数据；未读取真实朋友圈，也没有连接账号。</p></div><span class="source-status">${escapeHtml(status)}</span></div><div class="moment-actions">${source.status !== "deleted" ? `<button class="btn btn-small btn-quiet" type="button" data-action="moment-source-revoke" data-source-id="${escapeHtml(source.id)}">撤销来源</button><button class="btn btn-small btn-danger-soft" type="button" data-action="moment-source-delete" data-source-id="${escapeHtml(source.id)}">删除来源</button>` : ""}</div></article>`;
      }

      function momentClassificationLabel(value) {
        return ({ pending: "待确认", "topic-approved": "可作为话题", internal: "仅内部提醒", irrelevant: "不相关", sensitive: "敏感勿用", invalidated: "来源已失效" })[value] || "待确认";
      }

      function renderMomentSignal(signal) {
        const className = signal.classification === "internal" ? "is-internal" : signal.classification === "sensitive" ? "is-sensitive" : signal.invalidated ? "is-invalid" : "";
        const actions = signal.identityStatus !== "confirmed" ? `<button class="btn btn-small btn-primary" type="button" data-action="moment-identity" data-item-id="${escapeHtml(signal.itemId)}" data-person-id="p05">确认归到虚构联系人05（虚构）</button>` : signal.invalidated ? "" : [
          ["topic-approved", "可作为话题"], ["internal", "仅内部提醒"], ["irrelevant", "不相关"], ["sensitive", "敏感勿用"]
        ].map(([value, label]) => `<button class="btn btn-small ${signal.classification === value ? "btn-primary" : ""}" type="button" data-action="moment-classify" data-signal-id="${escapeHtml(signal.id)}" data-classification="${value}" aria-pressed="${signal.classification === value}">${label}</button>`).join("");
        return `<article class="moment-card ${className}"><div class="moment-head"><strong>${escapeHtml(signal.publisher)}</strong><span class="moment-status ${signal.classification === "topic-approved" ? "approved" : signal.classification === "sensitive" ? "sensitive" : ""}">${escapeHtml(momentClassificationLabel(signal.classification))}</span></div><div class="moment-meta"><span>${escapeHtml(signal.sourceId === "ms-wechat" ? "微信朋友圈导出（虚构）" : "碎银朋友圈（虚构）")}</span><span>${escapeHtml(signal.publishedAt)}</span><span>${signal.identityStatus === "confirmed" ? "身份已由你确认" : "身份待确认"}</span></div><div class="moment-body">${escapeHtml(signal.body)}${signal.mediaDescription ? `<br><span class="muted">媒体描述：${escapeHtml(signal.mediaDescription)}</span>` : ""}</div>${signal.kind === "third-party" ? '<p class="dialog-help">第三方评论、合照人物和转述默认仅内部，不能一步成为发布者事实或话题。</p>' : ""}<div class="moment-actions">${actions}</div></article>`;
      }

      function renderMomentSignalList(model, personId) {
